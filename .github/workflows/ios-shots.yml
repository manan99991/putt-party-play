name: iOS Screenshots (all tools)

# Visual pass for staging branches: builds the simulator app and screenshots every tool page,
# light + dark, publishing PNGs to the ci-logs branch under ios-shots-v2/. Triggered by touching
# ios/.shots (so it never slows the normal compile+test check).
on:
  push:
    branches-ignore: [handytools, ci-logs]
    paths: ["ios/.shots", ".github/workflows/ios-shots.yml"]
  workflow_dispatch:
    inputs:
      routes:
        description: Routes to shoot (space-separated); empty = the standard set
        required: false
        default: ""
      device:
        description: "iPhone (default), iPhoneMax (6.9-inch store size) or iPad (13-inch store size)"
        required: false
        default: "iPhone"

permissions:
  contents: write

concurrency:
  group: ios-shots-${{ github.ref }}-${{ inputs.device }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: xcode-27
    defaults:
      run: { working-directory: ios }
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Generate + build for testing
        env: { DEVICE: "${{ inputs.device || 'iPhone' }}" }
        run: |
          set -o pipefail
          brew install xcodegen && xcodegen generate
          xcodebuild -resolvePackageDependencies -project HandyTools.xcodeproj -scheme HandyTools
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          import os
          want=os.environ.get("DEVICE","iPhone")
          allv=[x for k,v in d.items() if "iOS" in k for x in v]
          if want=="iPad":
              c=[x for x in allv if "iPad Pro 13" in x["name"]] or [x for x in allv if x["name"].startswith("iPad Pro")]
          elif want=="iPhoneMax":
              c=[x for x in allv if "Pro Max" in x["name"]]
              c.sort(key=lambda x:(not x["name"].startswith("iPhone 17"), x["name"]))
          else:
              c=[x for x in allv if x["name"].startswith("iPhone")]
              c.sort(key=lambda x:(not x["name"].startswith("iPhone 17 Pro"), not x["name"].startswith("iPhone 16 Pro"), x["name"]))
          print(c[0]["udid"])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcodebuild build-for-testing -project HandyTools.xcodeproj -scheme HandyTools -destination "id=$UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -skipPackagePluginValidation -skipMacroValidation \
            2>&1 | tee build.log | grep -E "error:|TEST BUILD|BUILD" || true
          grep -qE "TEST BUILD SUCCEEDED|BUILD SUCCEEDED" build.log
      - name: Screenshot every route
        timeout-minutes: 60
        run: |
          # Taken by a UI test, so the test runner installs the app (plain simctl install timed out on cold simulators
          # and every picture was the simulator's home screen).
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          for p in camera microphone photos location; do xcrun simctl privacy "$UDID" grant $p com.tenzy.toolkit 2>/dev/null || true; done
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          mkdir -p shots
          ROUTES="${{ inputs.routes }}"; [ -n "$ROUTES" ] || ROUTES="home onboarding settings paywall qrwifi translate scan studio shield"
          for mode in light dark; do
            xcrun simctl ui "$UDID" appearance $mode
            TEST_RUNNER_SHOTS_DIR="$PWD/shots" TEST_RUNNER_SHOTS_MODE=$mode TEST_RUNNER_SHOTS_ROUTES="$ROUTES" \
              xcodebuild test-without-building -project HandyTools.xcodeproj -scheme HandyTools -destination "id=$UDID" -derivedDataPath build \
              -only-testing:HandyToolsUITests/ScreenshotTests CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
              2>&1 | grep -E "error:|Test Case|TEST (EXECUTE )?(SUCCEEDED|FAILED)" || true
          done
          ls shots | wc -l
      - name: Publish screenshots
        if: always()
        working-directory: .
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          D="${{ inputs.device || 'iPhone' }}"; NAME=ios-shots-v2; [ "$D" != "iPhone" ] && NAME="ios-shots-$D"
          bash .github/publish-log.sh "$NAME" ios/shots
      # Also upload as a downloadable artifact — the ci-logs push above is egress-limited and
      # often doesn't land, so this is the reliable way to retrieve the PNGs.
      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-shots
          path: ios/shots
          retention-days: 5
          if-no-files-found: warn
