name: Cert Bootstrap (one-time)

# Mints the single shared Apple Distribution cert and publishes it ENCRYPTED to a caller-held key on
# the cert-dropbox branch (useless ciphertext). Runs only when its own files change on handytools;
# touches no ios/** or android/** path, so the app build never fires. Delete after use.
on:
  push:
    branches: [handytools]
    paths: ['.github/workflows/cert-bootstrap.yml', 'tools/bootstrap-cert.mjs']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Decode ASC key
        env:
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: echo "$ASC_KEY_P8_B64" | base64 -d > work_asc.p8
      - name: Mint shared cert + profiles
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          P12_PASSWORD: tenzyshared
          BUNDLE_IDS: com.reckato.app,com.tenzy.toolkit
        run: |
          export ASC_KEY_P8="$(cat work_asc.p8)"
          node tools/bootstrap-cert.mjs
      - name: Encrypt the .p12 to the caller's public key
        env:
          PUBKEY_B64: ""
        run: |
          set -e
          echo "$PUBKEY_B64" | base64 -d > pub.pem
          openssl rand -out aeskey.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in out/dist.p12 -out out/dist.p12.enc -pass file:aeskey.bin
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in aeskey.bin -out out/aeskey.enc
          rm -f out/dist.p12 aeskey.bin work_asc.p8 pub.pem
      - name: Publish ciphertext to cert-dropbox branch
        run: |
          set -e
          mkdir -p drop
          cp out/dist.p12.enc out/aeskey.enc out/profiles.json drop/
          git config user.email "ci@local"; git config user.name "cert-bootstrap"
          git add -f drop
          git commit -q -m "cert drop (encrypted to caller key)"
          git push -f origin HEAD:cert-dropbox
          echo "published to cert-dropbox"
