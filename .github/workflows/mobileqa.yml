# Tenzy QA workflow — drop into manan99991/putt-party-play at .github/workflows/mobileqa.yml
# Tenzy is NATIVE (Kotlin/Compose on Android, SwiftUI on iOS) — this builds with gradle / xcodebuild,
# NOT expo prebuild. Copy qa/app.android.yaml and qa/app.ios.yaml from mobileqa/apps/tenzy/ into the repo's qa/.
#
# Secrets: ANTHROPIC_API_KEY (optional, for the smart brain). No signing needed — the agent runs on
# the emulator / simulator (unsigned debug builds).

name: Mobile QA agent
on:
  push:
    branches: [handytools]        # active branch (workflow_dispatch/schedule only fire from default)
  schedule:
    - cron: "23 7 * * 1"          # weekly deep run
  workflow_dispatch:
    inputs:
      steps: { description: exploration budget, default: "120" }

permissions: { contents: write, checks: write }

env:
  MOBILEQA_REPO: https://github.com/manan99991/mobileqa
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL; df -h /
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }   # repo has no gradle-wrapper.jar, so use the gradle binary

      # ---- NATIVE Android debug build (for the emulator)
      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          # Same unlock as the internal-testing release (see android.yml INTERNAL_UNLOCK): no ads/paywall/quota.
          gradle --no-daemon assembleDebug -PinternalUnlock=true --stacktrace --warning-mode none 2>&1 | tee ../build.log
          cp app/build/outputs/apk/debug/app-debug.apk ../app-debug.apk && ls -la ../app-debug.apk

      - name: Install mobileqa + Appium
        run: |
          pip install "git+${MOBILEQA_REPO}"
          npm install -g appium && appium driver install uiautomator2

      # Pick the brain by PROBING every provider we have a key for (qa/select_brain.py): explicit
      # OpenAI-compatible host, Groq, Gemini (model discovered from its /models list), OpenRouter,
      # Cerebras, then Anthropic. First one that answers a real request wins; the step summary shows
      # exactly why the others failed. No winner -> the agent's free heuristic brain.
      - name: Select LLM brain
        env:
          MOBILEQA_LLM_BASE_URL: ${{ vars.MOBILEQA_LLM_BASE_URL }}
          MOBILEQA_LLM_API_KEY: ${{ secrets.MOBILEQA_LLM_API_KEY }}
          MOBILEQA_MODEL: ${{ vars.MOBILEQA_MODEL }}
          MOBILEQA_VISION_MODEL: ${{ vars.MOBILEQA_VISION_MODEL }}
          MOBILEQA_NO_VISION: ${{ vars.MOBILEQA_NO_VISION }}
          MOBILEQA_REASONING_EFFORT: ${{ vars.MOBILEQA_REASONING_EFFORT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: python3 qa/select_brain.py

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Boot emulator + run agent
        run: |
          set +e; exec > >(tee mobileqa.log) 2>&1
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"; mkdir -p "$ANDROID_AVD_HOME"
          yes | sdkmanager "system-images;android-30;google_apis;x86_64" >/dev/null 2>&1 && echo "image ok"
          echo no | avdmanager --verbose create avd --force --name qa --package "system-images;android-30;google_apis;x86_64" --device pixel_6 2>&1 | tail -4
          emulator -list-avds | grep -qx qa || { echo "AVD create failed"; exit 1; }
          nohup emulator -avd qa -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -netdelay none -netspeed full > emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          for i in $(seq 1 60); do [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && { echo booted; break; }; sleep 5; done
          adb shell input keyevent 82 >/dev/null 2>&1 || true
          # Settle the emulator (hard-won on Reckato): a free runner's launcher/SystemUI ANRs for ~1 min
          # after boot and otherwise shows up as bogus critical/high "isn't responding" findings.
          adb shell settings put global hide_error_dialogs 1 || true
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          adb shell cmd package list packages >/dev/null 2>&1 || true
          sleep 45
          adb install -r -g app-debug.apk || true
          adb shell monkey -p com.tenzy.toolkit -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1 || true
          sleep 20
          adb shell am force-stop com.tenzy.toolkit || true
          # FREE 30-tool coverage gate: deep-link into every tool by its route and confirm each opens
          # (app stays focused) without crashing. Screenshots land in the report artifact as proof.
          mkdir -p reports/route-smoke
          routes="fitit scan studio video formatfix scrub cleaner qrwifi stitch shareready light contacts measure magnify procam gpsdash audiolab rest colorvision sorted textstudio translate voicenotes livecaptions shield lens memory datagrab describe vault"
          smokefail=0
          echo "=== 30-route smoke ==="
          for r in $routes; do
            adb shell am start -n com.tenzy.toolkit/com.handytools.app.MainActivity -e route "$r" >/dev/null 2>&1
            sleep 3
            if adb shell dumpsys window 2>/dev/null | grep -q "mCurrentFocus.*com.tenzy.toolkit"; then echo "  $r: OK"; else echo "  $r: NOT FOREGROUND (crash/blank?)"; smokefail=$((smokefail+1)); fi
            adb exec-out screencap -p > "reports/route-smoke/$r.png" 2>/dev/null || true
            adb shell am force-stop com.tenzy.toolkit >/dev/null 2>&1
          done
          echo "=== route smoke: $smokefail of 30 tools failed to open ==="
          nohup appium --relaxed-security --log appium.log >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4723/status >/dev/null && break; sleep 2; done
          python -m mobileqa.cli doctor qa/app.android.yaml || true
          timeout 88m python -m mobileqa.cli ci qa/app.android.yaml --steps ${{ github.event.inputs.steps || 600 }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: tenzy-android-report, path: reports/, retention-days: 30 }
      - name: JUnit summary
        if: always()
        uses: mikepenz/action-junit-report@v4
        with: { report_paths: reports/**/junit.xml, check_name: Tenzy QA (Android) }
      - name: Post results on the commit
        if: ${{ !success() }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo "### Tenzy QA (Android) ${{ job.status }}"
            echo '```'; tail -n 90 mobileqa.log 2>/dev/null; echo '```'
            echo '```'; tail -n 30 emulator.log 2>/dev/null; echo '```'; } > c.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@c.md >/dev/null || true
      # Full findings dump so every bug (not just the gating ones) is reviewable without the artifact.
      - name: Post full findings on the commit
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          FJ=$(ls -t reports/*/findings.json 2>/dev/null | head -1)
          [ -z "$FJ" ] && { echo "no findings.json"; exit 0; }
          python3 - "$FJ" > findings.md <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          def n(s): return sum(1 for f in data if f.get("severity") == s)
          print("### Tenzy QA — full findings: %d total (crit %d / high %d / med %d / low %d)"
                % (len(data), n("critical"), n("high"), n("medium"), n("low")))
          seen = set()
          for sev in ("critical", "high", "medium"):
              fs = [f for f in data if f.get("severity") == sev]
              if not fs: continue
              print("\n#### %s (%d)" % (sev.upper(), len(fs)))
              for f in fs:
                  d = (f.get("detail", "") or "").replace("\n", " ").strip()[:220]
                  print("- **[%s]** %s/%s — %s%s" % (
                      f.get("screen_name", "?"), f.get("category", "?"),
                      f.get("step", "?"), f.get("title", "?"),
                      (": " + d) if d else ""))
          PY
          # GitHub comment cap is 65535 chars — truncate defensively.
          head -c 60000 findings.md > fc.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@fc.md >/dev/null && echo "posted full findings" || echo "post failed"

  # iOS already has a green pipeline in this repo — once it builds HandyTools.app for the simulator,
  # boot a simulator, start Appium (xcuitest driver), and run: python -m mobileqa.cli ci qa/app.ios.yaml.
  # Kept manual-only here because macOS runners bill 10x; enable when you want it in the gate.
  ios:
    # macos-26 with the newest Xcode: this app targets iOS 26, so an older runner's Xcode can't build
    # it. Mirror the repo's working ios.yml build exactly (that pipeline is green).
    runs-on: macos-26
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Build HandyTools.app (simulator) — mirror ios.yml
        working-directory: ios
        run: |
          set -o pipefail
          brew install xcodegen || true
          xcodegen generate
          xcodebuild -resolvePackageDependencies -project HandyTools.xcodeproj -scheme HandyTools 2>&1 | tail -5
          xcodebuild build -project HandyTools.xcodeproj -scheme HandyTools \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -skipPackagePluginValidation -skipMacroValidation \
            2>&1 | tee build.log | grep -E "error:|BUILD|\*\*" || true
          grep -q "BUILD SUCCEEDED" build.log
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path "*Debug-iphonesimulator/HandyTools.app" -maxdepth 6 | head -1)
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
      - name: Sim setup + run agent
        run: |
          # No set -e: run every command, log each outcome to ios-qa.log, and let the final agent exit
          # decide the step. The commit-comment post step below makes this log readable off-runner
          # (the raw Actions log sits on a blob host we can't fetch).
          set +e
          exec > >(tee ios-qa.log) 2>&1
          echo "=== versions ==="; xcodebuild -version; echo "APP_PATH=${APP_PATH:-<empty>}"
          if [ -z "${APP_PATH:-}" ] || [ ! -d "${APP_PATH:-}" ]; then echo "FATAL: build produced no HandyTools.app (xcodegen/xcodebuild failed)"; exit 1; fi
          pip install "git+${MOBILEQA_REPO}" || { echo "FATAL: pip install mobileqa"; exit 1; }
          npm install -g appium || { echo "FATAL: npm install appium"; exit 1; }
          appium driver install xcuitest || { echo "FATAL: appium xcuitest driver"; exit 1; }
          # Use an existing available iPhone simulator the runner already provides (robust), like ios.yml.
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          c.sort(key=lambda x:(not x["name"].startswith("iPhone 17 Pro"), not x["name"].startswith("iPhone 16 Pro"), x["name"]))
          print(c[0]["udid"] if c else "")')
          echo "UDID=$UDID"
          [ -z "$UDID" ] && { echo "FATAL: no available iPhone simulator"; xcrun simctl list devices available; exit 1; }
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP_PATH" || { echo "FATAL: simctl install"; exit 1; }
          for p in all camera microphone photos location speech-recognition; do xcrun simctl privacy "$UDID" grant $p com.tenzy.toolkit 2>/dev/null || true; done
          nohup appium --relaxed-security --log appium.log >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4723/status >/dev/null && break; sleep 2; done
          python -m mobileqa.cli doctor qa/app.ios.yaml || true
          # macOS runners have no GNU `timeout` (that broke the agent step); the job-level timeout-minutes
          # plus --steps already bound the run. Use gtimeout only if coreutils happens to provide it.
          TO=""; command -v gtimeout >/dev/null 2>&1 && TO="gtimeout 60m"
          TENZY_APP="$APP_PATH" SIM_UDID="$UDID" $TO python -m mobileqa.cli ci qa/app.ios.yaml --steps ${{ github.event.inputs.steps || 240 }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: tenzy-ios-report, path: reports/, retention-days: 30 }
      - name: Post iOS QA log on the commit
        if: ${{ !success() }}
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo "### Tenzy QA (iOS) ${{ job.status }}"
            echo '```'; tail -n 140 ios-qa.log 2>/dev/null; echo '```'
            echo "appium tail:"; echo '```'; tail -n 25 appium.log 2>/dev/null; echo '```'; } > ic.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@ic.md >/dev/null || true
      - name: Post iOS findings on the commit
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          FJ=$(ls -t reports/*/findings.json 2>/dev/null | head -1)
          [ -z "$FJ" ] && { echo "no findings.json"; exit 0; }
          python3 - "$FJ" > ifind.md <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          def n(s): return sum(1 for f in data if f.get("severity") == s)
          print("### Tenzy QA (iOS) — full findings: %d total (crit %d / high %d / med %d / low %d)"
                % (len(data), n("critical"), n("high"), n("medium"), n("low")))
          for sev in ("critical", "high", "medium"):
              fs = [f for f in data if f.get("severity") == sev]
              if not fs: continue
              print("\n#### %s (%d)" % (sev.upper(), len(fs)))
              for f in fs:
                  d = (f.get("detail","") or "").replace("\n"," ").strip()[:200]
                  print("- **[%s]** %s/%s — %s%s" % (f.get("screen_name","?"), f.get("category","?"), f.get("step","?"), f.get("title","?"), (": "+d) if d else ""))
          PY
          head -c 60000 ifind.md > ifc.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@ifc.md >/dev/null && echo posted || echo failed
