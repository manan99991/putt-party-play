name: Android

on:
  push:
    branches: [handytools]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs so they don't race on the ci-logs branch / GitHub Release.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: android }
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace --warning-mode none 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Build release AAB (signed if secrets exist, otherwise debug-signed)
        if: success()
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > upload.jks; fi
          echo "=== keystore sanity ===" | tee -a build.log
          if [ -f upload.jks ]; then
            echo "upload.jks bytes: $(wc -c < upload.jks) (expect ~2694)" | tee -a build.log
            keytool -list -keystore upload.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>&1 \
              | grep -viE "Warning|proprietary" | tee -a build.log || echo "KEYTOOL CHECK FAILED (bad password/alias or corrupt keystore)" | tee -a build.log
          else
            echo "no upload.jks — KEYSTORE_B64 secret is empty" | tee -a build.log
          fi
          echo "=== bundleRelease ===" | tee -a build.log
          gradle --no-daemon bundleRelease --stacktrace --warning-mode none 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Publish build log
        if: always()
        working-directory: .
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: bash .github/publish-log.sh android android/build.log

      - name: Publish APK + AAB to ci-logs branch
        if: success()
        continue-on-error: true   # large binaries can fail to push; never block the GitHub Release below
        working-directory: .
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          mkdir -p out && cp android/app/build/outputs/apk/debug/app-debug.apk out/HandyTools-debug.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/HandyTools-release-unsigned.aab
          bash .github/publish-log.sh android-apk out/HandyTools-debug.apk
          bash .github/publish-log.sh android-aab out/HandyTools-release-unsigned.aab

      - name: GitHub Release with the APK (direct download link for phones)
        if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: handytools-android-latest
          name: HandyTools Android (latest build)
          body: "Latest build. APK = install on a phone to test (allow 'install unknown apps'). AAB = upload to Play Console."
          prerelease: true
          files: |
            out/HandyTools-debug.apk
            out/HandyTools-release-unsigned.aab

      # Auto-publish the signed AAB to Play internal testing — runs only once the
      # PLAY_SERVICE_ACCOUNT_JSON secret is set (the one-time credential). Until then it's skipped.
      - name: Publish AAB to Play (internal testing)
        if: ${{ success() && env.PLAY_JSON != '' }}
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.tenzy.toolkit
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      # Push the store LISTING (title, descriptions, changelog, feature graphic, icon, screenshots)
      # from android/fastlane/metadata via fastlane supply. Best-effort: runs only once the Play
      # service-account secret is set, and never blocks the build. Play accepts this only after the
      # app's one-time content declarations (data safety, content rating) are completed in console.
      - name: Push Play store listing (metadata + graphics)
        if: ${{ success() && env.PLAY_JSON != '' }}
        continue-on-error: true
        run: |
          echo "$PLAY_JSON" > "$GITHUB_WORKSPACE/play-key.json"
          export SUPPLY_JSON_KEY_PATH="$GITHUB_WORKSPACE/play-key.json"
          gem install fastlane --no-document --quiet || sudo gem install fastlane --no-document --quiet
          fastlane listing 2>&1 | tee supply.log || true
      - name: Publish listing-push log
        if: always()
        working-directory: .
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: bash .github/publish-log.sh android-supply android/supply.log || true

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: ci-logs, path: logs }
      - uses: actions/checkout@v4
        with: { path: src }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm || true
      - name: Emulator + screenshots
        timeout-minutes: 20
        run: |
          mkdir -p shots
          {
            set -x
            echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            SDK=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
            ls $SDK; ls $SDK/cmdline-tools || true
            SDKM=$(ls -d $SDK/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
            yes | $SDKM --licenses >/dev/null 2>&1 || true
            for try in 1 2 3; do
              $SDKM --install "platform-tools" "emulator" "system-images;android-34;google_apis;x86_64" 2>&1 | tail -3
              [ -x $SDK/emulator/emulator ] && [ -f $SDK/system-images/android-34/google_apis/x86_64/system.img ] && break
              echo "sdk install incomplete, retry $try"; sleep 10
            done
            AVDM=$(dirname $SDKM)/avdmanager
            export ANDROID_AVD_HOME=$HOME/.android/avd; mkdir -p $ANDROID_AVD_HOME
            echo no | $AVDM create avd -n shot -k "system-images;android-34;google_apis;x86_64" -d pixel_7 --force
            ls -la $ANDROID_AVD_HOME; $SDK/emulator/emulator -list-avds
            export PATH=$SDK/emulator:$SDK/platform-tools:$PATH
            nohup emulator -avd shot -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -accel on > emulator.log 2>&1 &
            EMU=$!
            for i in $(seq 1 90); do
              b=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r'); [ "$b" = "1" ] && break
              kill -0 $EMU 2>/dev/null || { echo "emulator process died"; break; }
              [ $((i % 6)) -eq 0 ] && { echo "boot wait ${i}0s"; adb devices; tail -3 emulator.log; }
              sleep 10
            done
            adb shell getprop sys.boot_completed || true
            tail -30 emulator.log
            adb shell settings put global hide_error_dialogs 1
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb shell input keyevent 82 || true
            cp logs/android-apk.bin HandyTools.apk
            adb install -r HandyTools.apk
            adb logcat -c
            sleep 3
            for mode in light dark; do
              if [ $mode = dark ]; then adb shell cmd uimode night yes; else adb shell cmd uimode night no; fi
              sleep 2
              for r in onboarding onboarding2 onboarding3 setup settings privacy home clipboard screenshot quick shortcut alarm volume ocr notifs scratchpad awake paywall ring homepro; do
                adb shell am force-stop com.tenzy.toolkit || true
                adb shell am start -W -n com.tenzy.toolkit/com.handytools.app.MainActivity --es route $r || true
                sleep 6
                adb exec-out screencap -p > shots/android-$mode-$r.png || true
              done
            done
            ls -la shots
            adb logcat -d -s AndroidRuntime:E > shots/_crashes.log 2>&1 || true
            adb logcat -d 2>/dev/null | grep -iE 'handytools' | tail -300 > shots/_logcat-handytools.log || true
            tail -20 emulator.log
          } 2>&1 | tee shots/_run.log
      - name: Publish screenshots
        if: always()
        working-directory: src
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: bash .github/publish-log.sh android-shots ../shots
