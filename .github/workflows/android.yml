name: Android

on:
  push:
    branches: [handytools]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: android }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace --warning-mode none 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Build release AAB (signed if secrets exist, otherwise debug-signed)
        if: success()
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > upload.jks; fi
          gradle --no-daemon bundleRelease --warning-mode none

      - name: Publish build log
        if: always()
        working-directory: .
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: bash .github/publish-log.sh android android/build.log

      - name: Publish APK + AAB to ci-logs branch
        if: success()
        working-directory: .
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          mkdir -p out && cp android/app/build/outputs/apk/debug/app-debug.apk out/HandyTools-debug.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/HandyTools-release-unsigned.aab
          bash .github/publish-log.sh android-apk out/HandyTools-debug.apk
          bash .github/publish-log.sh android-aab out/HandyTools-release-unsigned.aab

      - name: GitHub Release with the APK (direct download link for phones)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: handytools-android-latest
          name: HandyTools Android (latest build)
          body: "Debug build for testing. Install on Android: download, open, allow 'install unknown apps'."
          prerelease: true
          files: out/HandyTools-debug.apk

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: ci-logs, path: logs }
      - uses: actions/checkout@v4
        with: { path: src }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Boot emulator, install, screenshot every tool
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            adb install -r logs/android-apk.bin
            mkdir -p shots
            adb shell settings put global window_animation_scale 0
            for r in home clipboard screenshot quick shortcut alarm volume ocr notifs scratchpad awake paywall; do
              adb shell am force-stop com.handytools.app
              adb shell am start -n com.handytools.app/.MainActivity --es route $r >/dev/null
              sleep 5
              adb exec-out screencap -p > shots/android-$r.png
            done
            ls -la shots
      - name: Publish screenshots
        if: always()
        working-directory: src
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: bash .github/publish-log.sh android-shots ../shots
