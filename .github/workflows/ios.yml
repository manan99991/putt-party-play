name: iOS

on:
  push:
    branches: [handytools]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

# Serialize iOS runs so they never race on the shared cert cache (a race makes several runs each
# create a new distribution cert, which eventually forces a revoke → "certificate revoked" email).
# Queue rather than cancel, so in-flight TestFlight uploads still finish.
concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  build:
    if: "${{ !contains(github.event.head_commit.message, 'Ship-Store=YES') && !contains(github.event.head_commit.message, 'Ship-Stage=YES') }}"
    runs-on: xcode-27
    defaults:
      run: { working-directory: ios }
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          ls /Applications | grep -i xcode
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios
      - name: Install XcodeGen + generate + resolve
        run: |
          set -o pipefail
          { brew install xcodegen && xcodegen generate && xcodebuild -resolvePackageDependencies -project HandyTools.xcodeproj -scheme HandyTools; } 2>&1 | tee setup.log
      - name: Build (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project HandyTools.xcodeproj -scheme HandyTools \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -skipPackagePluginValidation -skipMacroValidation \
            2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD|\*\*" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Report built Info.plist permission strings
        working-directory: .
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path "*Debug-iphonesimulator/HandyTools.app" -maxdepth 6 | head -1)
          P="$APP/Info.plist"
          echo "built app plist: $P"
          { echo "=== $P ==="; plutil -p "$P" 2>&1 | grep -iE "Usage|GADApplication|CFBundleURLSchemes|UIBackgroundModes" || true; echo "--- presence ---"; } > plist-check.log
          summary=""
          for k in NSCameraUsageDescription NSMicrophoneUsageDescription NSSpeechRecognitionUsageDescription NSLocationWhenInUseUsageDescription NSMotionUsageDescription NSPhotoLibraryUsageDescription NSPhotoLibraryAddUsageDescription NSFaceIDUsageDescription; do
            if plutil -extract "$k" raw "$P" >/dev/null 2>&1; then r=OK; else r=MISS; fi
            echo "$r $k" >> plist-check.log; summary="$summary ${k#NS}=$r"
          done
          cat plist-check.log
          echo "::warning title=plist::$summary"
          bash .github/publish-log.sh ios-plist plist-check.log || true
      # Accuracy on real photos runs in its own workflow (qa-lab.yml) so a slow or cancelled step here never skips it.
      - name: Simulator screenshots of every tool
        # Not on a TestFlight build any more: twice on 20 Nov this step hung after every test had passed and the
        # runner never came back (the 30-minute cap couldn't kill it), so no build reached the phone. Store shots
        # only; the visual pass runs in its own workflow (ios-shots.yml) where a hang can't hold up a build.
        if: "${{ contains(github.event.head_commit.message, 'Ship-Store=YES') || contains(github.event.head_commit.message, 'Capture-Shots=YES') }}"
        # Screenshots never gate a TestFlight: on 20 Nov this step hung for two hours after every test
        # had passed and took the whole build down with it. Capped, and a failure here doesn't fail the job.
        timeout-minutes: 45
        continue-on-error: true
        run: |
          t() { local n=$1; shift; perl -e 'alarm shift; exec @ARGV' "$n" "$@" || echo "::warning::timed out or failed after ${n}s: $*"; }
          set -x
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path "*Debug-iphonesimulator/HandyTools.app" -maxdepth 6 | head -1)
          echo "APP=$APP"
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone 17 Pro") or x["name"].startswith("iPhone 16 Pro") or x["name"].startswith("iPhone")]
          c.sort(key=lambda x:(not x["name"].startswith("iPhone 17 Pro"), not x["name"].startswith("iPhone 16 Pro"), x["name"]))
          print(c[0]["udid"]); print(c[0]["name"], file=sys.stderr)')
          xcrun simctl boot "$UDID" || true
          t 300 xcrun simctl bootstatus "$UDID" -b
          # A just-booted simulator can take minutes to accept its first install (the tests used to warm it up first).
          for try in 1 2 3; do
            t 240 xcrun simctl install "$UDID" "$APP"
            xcrun simctl get_app_container "$UDID" com.tenzy.toolkit >/dev/null 2>&1 && break
            sleep 20
          done
          # No app, no screenshots: 50 pictures of the simulator's home screen help nobody.
          xcrun simctl get_app_container "$UDID" com.tenzy.toolkit >/dev/null 2>&1 || { echo "::warning::app didn't install on the simulator; no screenshots this run"; exit 0; }
          # Explicitly grant every permission a tool might ask for, so no system permission alert
          # pops during capture and lingers over later screenshots (grant all alone left mic undetermined).
          for p in all camera microphone photos location speech-recognition; do
            xcrun simctl privacy "$UDID" grant $p com.tenzy.toolkit 2>/dev/null || true
          done
          # Pre-answer the App Tracking Transparency prompt so it doesn't cover every screenshot
          t 60 xcrun simctl launch "$UDID" com.tenzy.toolkit -screenshots; sleep 4
          xcrun simctl spawn "$UDID" defaults write com.apple.AppTrackingTransparency.plist 2>/dev/null || true
          xcrun simctl terminate "$UDID" com.tenzy.toolkit || true
          mkdir -p shots
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          for mode in light dark; do
            xcrun simctl ui "$UDID" appearance $mode
            for r in onboarding onboarding2 onboarding3 setup settings privacy home paywall homepro fitit scan studio video formatfix scrub cleaner qrwifi stitch shareready light contacts measure magnify procam gpsdash audiolab rest colorvision sorted textstudio translate voicenotes livecaptions shield lens memory datagrab describe vault menu thinking pdfpages pdfconvert ringtone sticker run-lecture-summary run-short-summary run-receipt-to-row run-photo-under-2mb run-video-chat run-pdf-email run-what-is-this; do
              xcrun simctl terminate "$UDID" com.tenzy.toolkit 2>/dev/null || true
              t 60 xcrun simctl launch "$UDID" com.tenzy.toolkit -screenshots -sample -route $r
              sleep 9
              t 30 xcrun simctl io "$UDID" screenshot shots/ios-$mode-$r.png
            done
          done
          # Store hero captures: demo data on (-demo), iPhone then iPad 13", one appearance (the app's own theme).
          HERO="explore home describebuilt templates mytools medreminder brief pricewatch contacts sorted warranty cleaner fitit procam soundboard sticker scan light measure untangle thinking gpsdash pdfpages translate shield rest meetingnotes studio privacy paywall"
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl uninstall "$UDID" com.tenzy.toolkit || true
          t 120 xcrun simctl install "$UDID" "$APP"
          for p in all camera microphone photos location speech-recognition contacts; do xcrun simctl privacy "$UDID" grant $p com.tenzy.toolkit 2>/dev/null || true; done
          for r in $HERO; do
            xcrun simctl terminate "$UDID" com.tenzy.toolkit 2>/dev/null || true
            t 60 xcrun simctl launch "$UDID" com.tenzy.toolkit -screenshots -sample -demo -route $r
            sleep 9
            t 30 xcrun simctl io "$UDID" screenshot shots/hero-iphone-$r.png
          done
          IPAD=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for k,v in d.items() if "iOS" in k for x in v if "iPad Pro" in x["name"] and "13" in x["name"]] or [x for k,v in d.items() if "iOS" in k for x in v if "iPad" in x["name"]]
          c.sort(key=lambda x:x["name"]); print(c[-1]["udid"] if c else "")')
          if [ -n "$IPAD" ]; then
            xcrun simctl boot "$IPAD" || true; t 300 xcrun simctl bootstatus "$IPAD" -b
            for try in 1 2 3; do t 240 xcrun simctl install "$IPAD" "$APP"; xcrun simctl get_app_container "$IPAD" com.tenzy.toolkit >/dev/null 2>&1 && break; sleep 20; done
            xcrun simctl status_bar "$IPAD" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 || true
            xcrun simctl ui "$IPAD" appearance dark
            for p in all camera microphone photos location speech-recognition contacts; do xcrun simctl privacy "$IPAD" grant $p com.tenzy.toolkit 2>/dev/null || true; done
            for r in $HERO; do
              xcrun simctl terminate "$IPAD" com.tenzy.toolkit 2>/dev/null || true
              t 60 xcrun simctl launch "$IPAD" com.tenzy.toolkit -screenshots -sample -demo -route $r
              sleep 9
              t 30 xcrun simctl io "$IPAD" screenshot shots/hero-ipad-$r.png
            done
          fi
          ls -la shots
      - name: Publish screenshots
        if: "${{ always() && (contains(github.event.head_commit.message, 'Ship-Store=YES') || contains(github.event.head_commit.message, 'Capture-Shots=YES')) }}"
        working-directory: .
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: bash .github/publish-log.sh ios-shots ios/shots
      - name: Publish build log
        if: always()
        working-directory: .
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          { echo "== xcode"; ls /Applications | grep -i xcode; xcodebuild -version 2>&1; echo "== setup.log"; cat ios/setup.log 2>/dev/null; echo "== build.log"; cat ios/build.log 2>/dev/null; } > ios-full.log
          bash .github/publish-log.sh ios ios-full.log || true
          bash .github/publish-log.sh "ios-build-${GITHUB_RUN_ID}" ios-full.log || true

  # Per-tool flow tests — informational only. Nothing `needs` this job and it is allowed to fail
  # (continue-on-error), so a flaky synthetic-input flake here NEVER blocks TestFlight or the store
  # submit. It still runs on every push for visibility (failures surface as annotations).
  flowtests:
    # On-demand only: this informational job no longer competes for a macOS runner on every push,
    # so the critical build + test jobs acquire runners faster while GitHub's shared macOS pool is
    # congested. Run it manually from the Actions tab (workflow_dispatch) when you want the flow pass.
    if: "${{ github.event_name == 'workflow_dispatch' }}"
    continue-on-error: true
    runs-on: xcode-27
    defaults:
      run: { working-directory: ios }
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Install XcodeGen + generate + resolve
        run: |
          set -o pipefail
          { brew install xcodegen && xcodegen generate && xcodebuild -resolvePackageDependencies -project HandyTools.xcodeproj -scheme HandyTools; } 2>&1 | tee setup.log
      - name: ToolFlowTests (informational — never gates the deploy)
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          c.sort(key=lambda x:x["name"]); print(c[-1]["udid"])')
          xcrun simctl bootstatus "$UDID" -b || xcrun simctl boot "$UDID" || true
          for p in camera microphone photos location; do
            xcrun simctl privacy "$UDID" grant $p com.tenzy.toolkit 2>/dev/null || true
          done
          xcodebuild test \
            -project HandyTools.xcodeproj -scheme HandyTools \
            -destination "id=$UDID" \
            -only-testing:HandyToolsUITests/ToolFlowTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -skipPackagePluginValidation -skipMacroValidation \
            2>&1 | tee flow.log | grep -E "Test Case .*(passed|failed)|Executed .* test|TEST (SUCCEEDED|FAILED)" || true
          grep -E "Test Case .*failed|failed - " flow.log | sed 's#/Users/runner/work/[^/]*/[^/]*/##' | sort -u | sed 's/^/::warning::/' || true
      - name: Publish flow-test log
        if: always()
        working-directory: .
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          { echo "== flow.log (results)"; grep -E "Test Case .*(passed|failed)|Executed .* test|TEST (SUCCEEDED|FAILED)" ios/flow.log 2>/dev/null | head -200; } > ios-flow.log
          bash .github/publish-log.sh ios-flow ios-flow.log || true

  # Runs only when App Store Connect secrets are present. Archives, signs with an
  # ASC API key via automatic signing, and uploads to TestFlight. Gated on `build` (which runs the tests): a red
  # suite blocks the upload.
  # The test gate, split four ways so the parts run at the same time on separate Macs (one after another they took
  # 62 min + the iPad pass). Nothing is dropped: the upload waits for every part, as before.
  tests:
    if: "${{ !contains(github.event.head_commit.message, 'Ship-Store=YES') && !contains(github.event.head_commit.message, 'Ship-Stage=YES') }}"
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: unit
            device: iPhone
            only: "-only-testing:HandyToolsTests"
          - part: smoke
            device: iPhone
            only: "-only-testing:HandyToolsUITests/ToolSmokeTests -only-testing:HandyToolsUITests/ToolControlsReachableTests"
          - part: flows
            device: iPhone
            only: "-only-testing:HandyToolsUITests/LiveToolTests -only-testing:HandyToolsUITests/PromiseTests -only-testing:HandyToolsUITests/MultiPhotoTests"
          - part: ipad
            device: iPad
            only: "-only-testing:HandyToolsUITests/ToolSmokeTests"
    defaults:
      run: { working-directory: ios }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Generate project
        run: |
          set -o pipefail
          { brew install xcodegen && xcodegen generate && xcodebuild -resolvePackageDependencies -project HandyTools.xcodeproj -scheme HandyTools; } 2>&1 | tail -3
      - name: Test — ${{ matrix.part }} (gates the deploy)
        timeout-minutes: 80
        env: { DEVICE: "${{ matrix.device }}", ONLY: "${{ matrix.only }}" }
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys,os
          d=json.load(sys.stdin)["devices"]; want=os.environ["DEVICE"]
          c=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith(want)]
          c.sort(key=lambda x:x["name"]); print(c[-1]["udid"] if c else "")')
          [ -n "$UDID" ] || { echo "::error::no $DEVICE simulator"; exit 1; }
          echo "simulator=$UDID part=${{ matrix.part }}"
          # Boot and pre-authorize so the live tests drive the real camera / mic / location paths with no prompt.
          xcrun simctl bootstatus "$UDID" -b || xcrun simctl boot "$UDID" || true
          for p in camera microphone photos location contacts; do xcrun simctl privacy "$UDID" grant $p com.tenzy.toolkit 2>/dev/null || true; done
          xcodebuild test -project HandyTools.xcodeproj -scheme HandyTools -destination "id=$UDID" $ONLY \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -skipPackagePluginValidation -skipMacroValidation \
            2>&1 | tee test.log | grep -E "error:|Test Case .*(passed|failed)|Executed .* test|TEST (SUCCEEDED|FAILED)|BUILD" || true
          grep -E "error:|Test Case .*failed|failed - " test.log | sed 's#/Users/runner/work/[^/]*/[^/]*/##' | sort -u | head -20 | sed 's/^/::error::/' || true
          grep -q "TEST SUCCEEDED" test.log || { echo "== last lines"; tail -60 test.log; exit 1; }
      - name: Publish test log
        if: always()
        working-directory: .
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          { echo "== ${{ matrix.part }} (results)"; grep -E "error:|Test Case .*(passed|failed)|Executed .* test|TEST (SUCCEEDED|FAILED)" ios/test.log 2>/dev/null | head -300; } > ios-test-${{ matrix.part }}.log
          bash .github/publish-log.sh ios-test-${{ matrix.part }} ios-test-${{ matrix.part }}.log || true

  # Every ready-made tool run on a real file, and every tool opened with its sample, each screen read the way
  # VoiceOver reads it (the 20 Nov crash). About an hour, so it runs beside the build on the daily TestFlight commit
  # and the upload waits for it: a crash, a job that never ends or a blank finish stops the upload.
  realinput:
    if: "${{ contains(github.event.head_commit.message, 'Ship-Build=YES') }}"
    runs-on: xcode-27
    timeout-minutes: 165
    defaults:
      run: { working-directory: ios }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Generate project
        run: brew install xcodegen >/dev/null && xcodegen generate
      # 23 Nov: 105 min stopped it mid-run with nothing wrong. Measured alone, every tool took 30-61 s (66 tools, 40 min);
      # with the ~20 min build and the ~55 min flow tests that is ~115 min. 150 leaves room; a tool that truly hangs
      # still fails (each tool's time is in its TOOLINPUT line).
      - name: Real files through every tool (gates the upload)
        timeout-minutes: 150
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          c.sort(key=lambda x:x["name"]); print(c[-1]["udid"])')
          xcrun simctl bootstatus "$UDID" -b || xcrun simctl boot "$UDID" || true
          for p in camera microphone photos location; do xcrun simctl privacy "$UDID" grant $p com.tenzy.toolkit 2>/dev/null || true; done
          xcodebuild build-for-testing -project HandyTools.xcodeproj -scheme HandyTools -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -skipPackagePluginValidation -skipMacroValidation 2>&1 | tail -3
          xcodebuild test-without-building -project HandyTools.xcodeproj -scheme HandyTools -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -skipPackagePluginValidation -skipMacroValidation \
            -only-testing:HandyToolsUITests/RealInputTests -only-testing:HandyToolsUITests/ToolRealInputTests \
            2>&1 | tee realinput.log | grep -E "error:|Test Case .*(passed|failed)|Executed .* test|TEST (EXECUTE )?(SUCCEEDED|FAILED)|REALINPUT|TOOLINPUT" || true
          grep -qE "TEST (EXECUTE )?SUCCEEDED" realinput.log
      - name: Publish log
        if: always()
        working-directory: .
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          grep -E "error:|Test Case|Executed|TEST (EXECUTE )?(SUCCEEDED|FAILED)|REALINPUT|TOOLINPUT|failed -" ios/realinput.log 2>/dev/null | head -400 > ios-realinput.log || true
          # Any crash during the real-file run: the symbol summary only (no screen content), so a "closed" is diagnosable.
          { ls -t ~/Library/Logs/DiagnosticReports/HandyTools-* 2>/dev/null | head -3 | xargs -r python3 tools/ips_summary.py; } >> ios-realinput.log 2>&1 || true
          bash .github/publish-log.sh ios-realinput ios-realinput.log || true

  testflight:
    needs: [build, tests, realinput]
    # Decoupled from `build` so signing can be iterated fast — `archive` compiles the code too.
    # HOLD: build + test run on every push, but TestFlight upload happens ONLY when the commit
    # message contains the trailer line  Ship-Build: YES  — a distinctive token that is never written
    # in ordinary prose (so a commit that merely mentions shipping can't trigger a deploy by accident).
    # Default pushes build-and-test, never deploy.
    if: "${{ contains(github.event.head_commit.message, 'Ship-Build=YES') }}"
    runs-on: xcode-27
    defaults:
      run: { working-directory: ios }
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - run: brew install xcodegen
      - name: Inject team id + generate + stamp build number
        run: |
          sed -i '' "s/YOUR_TEAM_ID/$TEAM_ID/g" project.yml HandyTools/Resources/Products.storekit
          xcodegen generate
          # GUARD: never upload a universal build by accident — the app must be iPhone-only (family 1).
          DF=$(xcodebuild -showBuildSettings -project HandyTools.xcodeproj -target HandyTools 2>/dev/null | awk -F'= ' '/ TARGETED_DEVICE_FAMILY /{print $2; exit}' | tr -d ' ')
          echo "TARGETED_DEVICE_FAMILY=$DF"
          [ "$DF" = "1,2" ] || { echo "::error::App is not universal (TARGETED_DEVICE_FAMILY=$DF) — expected 1,2 (iPhone+iPad)"; exit 1; }
          # Force a unique, ever-increasing CFBundleVersion directly into every generated Info.plist
          # (XcodeGen writes a literal "1", so a build-setting override alone doesn't take).
          BN=$(date +%s)
          for p in HandyTools ClipboardKeyboard ShareExtension StickyWidget; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BN" "$p/Info.plist" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BN" "$p/Info.plist"
          done
          V=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" HandyTools/Info.plist)
          echo "stamped build number: expected $BN, got $V"
          [ "$V" = "$BN" ] || { echo "BUILD NUMBER STAMP FAILED"; exit 1; }
      - name: Write ASC key + export fastlane auth env
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KP="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8_B64" | base64 -d > "$KP"
          echo "ASC_KEY_PATH=$KP" >> $GITHUB_ENV
          # spaceship / produce pick these up for API-key auth
          echo "APP_STORE_CONNECT_API_KEY_KEY_ID=$ASC_KEY_ID" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_API_KEY_ISSUER_ID=$ASC_ISSUER_ID" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_API_KEY_KEY_FILEPATH=$KP" >> $GITHUB_ENV
          echo "FASTLANE_HIDE_CHANGELOG=1" >> $GITHUB_ENV
          python3 - <<'PY' > asc_key.json
          import json, os
          kid = os.environ["ASC_KEY_ID"]
          p8 = open(os.path.expanduser(f"~/.appstoreconnect/private_keys/AuthKey_{kid}.p8")).read()
          print(json.dumps({"key_id": kid, "issuer_id": os.environ["ASC_ISSUER_ID"], "key": p8, "in_house": False}))
          PY
      - name: Reconcile subscriptions + prices (idempotent)
        continue-on-error: true   # never block the TestFlight upload if the ASC product API balks
        run: |
          set -o pipefail
          fastlane subscriptions 2>&1 | tee subs.log || true
      - name: Publish subscriptions log
        if: always()
        working-directory: .
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: bash .github/publish-log.sh ios-subs ios/subs.log || true
      - name: Write the shared distribution cert from secret
        env:
          IOS_DIST_P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
        run: |
          [ -n "$IOS_DIST_P12_B64" ] || { echo "IOS_DIST_P12_B64 secret is not set — add it in repo Settings → Secrets"; exit 1; }
          P12="$GITHUB_WORKSPACE/ios/dist.p12"
          echo "$IOS_DIST_P12_B64" | base64 -d > "$P12"
          BYTES=$(wc -c < "$P12")
          echo "wrote $P12 ($BYTES bytes)"
          [ "$BYTES" -gt 0 ] || { echo "decoded cert is empty — check the IOS_DIST_P12_B64 secret value"; exit 1; }
          echo "P12_PATH=$P12" >> "$GITHUB_ENV"
      - name: Fastlane build + upload to TestFlight
        env:
          P12_PASSWORD: tenzyshared
        run: |
          set -o pipefail
          fastlane beta 2>&1 | tee fastlane.log
      - name: Publish fastlane log (always)
        if: always()
        working-directory: .
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          { echo "===== fastlane.log errors ====="; grep -iE "error|fail|❌|could not|unable|invalid|no profiles|certificate|provisioning|entitlement|app group|Authentication|bundle id|\[!\]|Successfully|Uploaded|TestFlight|App ID" ios/fastlane.log 2>/dev/null | head -140; echo; echo "===== fastlane.log tail ====="; tail -90 ios/fastlane.log 2>/dev/null; } > ios-fastlane-err.log
          bash .github/publish-log.sh ios-archive ios-fastlane-err.log
          bash .github/publish-log.sh "ios-archive-${GITHUB_RUN_ID}" ios-fastlane-err.log

  # Public App Store submission (metadata + screenshots + submit for review). No binary is built
  # here — it reuses the build already on TestFlight. Double-gated so it NEVER runs by accident:
  #   - repo variable  STORE_SUBMIT_ENABLED = true
  #   - commit message contains the trailer  Ship-Store=YES
  # Release is held for a manual tap after approval (automatic_release: false in the Fastfile).
  # Metadata + screenshots + submit-for-review is a pure App Store Connect API call — no Xcode,
  # no Mac needed. Runs on ubuntu (fast, abundant runners) and does NOT depend on the macOS build/
  # test jobs, so a scarce/cancelled Mac runner can never block the submit. Gated on the Ship-Store
  # marker in the commit subject.
  store:
    if: "${{ contains(github.event.head_commit.message, 'Ship-Store=YES') }}"
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: ios }
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3" }
      - name: Install fastlane
        run: gem install fastlane --no-document
      - name: Write ASC key + export fastlane auth env
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KP="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8_B64" | base64 -d > "$KP"
          echo "ASC_KEY_PATH=$KP" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_API_KEY_KEY_ID=$ASC_KEY_ID" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_API_KEY_ISSUER_ID=$ASC_ISSUER_ID" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_API_KEY_KEY_FILEPATH=$KP" >> $GITHUB_ENV
          echo "FASTLANE_HIDE_CHANGELOG=1" >> $GITHUB_ENV
      - name: Fastlane deliver (metadata + screenshots + submit for review)
        run: |
          set -o pipefail
          fastlane release 2>&1 | tee deliver.log
      - name: Publish deliver log (always)
        if: always()
        working-directory: .
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          { echo "===== deliver.log ====="; grep -iE "error|fail|❌|invalid|missing|too long|rejected|\[!\]|Successfully|submitted|Waiting For Review|screenshots|metadata" ios/deliver.log 2>/dev/null | head -160; echo; echo "===== tail ====="; tail -80 ios/deliver.log 2>/dev/null; } > ios-deliver.log
          bash .github/publish-log.sh ios-deliver ios-deliver.log || true

  # STAGE: push metadata + screenshots to the editable version WITHOUT submitting (STAGE_ONLY=true),
  # and reconcile the subscription (price, availability, App Review screenshot) so it is ready to be
  # included in the review submission. Leaves the final "Add for Review" tap to Manan. Gated on the
  # Ship-Stage=YES marker; pure ASC API (ubuntu, no Mac).
  stage:
    if: "${{ contains(github.event.head_commit.message, 'Ship-Stage=YES') }}"
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: ios }
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
      STAGE_ONLY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3" }
      - name: Install fastlane
        run: gem install fastlane --no-document
      - name: Write ASC key + export fastlane auth env
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KP="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8_B64" | base64 -d > "$KP"
          echo "ASC_KEY_PATH=$KP" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_API_KEY_KEY_ID=$ASC_KEY_ID" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_API_KEY_ISSUER_ID=$ASC_ISSUER_ID" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_API_KEY_KEY_FILEPATH=$KP" >> $GITHUB_ENV
          echo "FASTLANE_HIDE_CHANGELOG=1" >> $GITHUB_ENV
      - name: Reconcile subscription (price, availability, review screenshot)
        run: fastlane subscriptions 2>&1 | tee subs.log || true
      - name: Fastlane deliver — STAGE (metadata + screenshots, NO submit)
        run: |
          set -o pipefail
          fastlane release 2>&1 | tee deliver.log
      - name: Publish stage log (always)
        if: always()
        working-directory: .
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          { echo "===== deliver.log ====="; grep -iE "error|fail|❌|invalid|missing|too long|rejected|\[!\]|Successfully|Staged|screenshots|metadata|review screenshot|upload" ios/deliver.log 2>/dev/null | head -160; echo; echo "===== subs ====="; tail -50 ios/subs.log 2>/dev/null; echo; echo "===== deliver tail ====="; tail -60 ios/deliver.log 2>/dev/null; } > ios-stage.log
          bash .github/publish-log.sh ios-stage ios-stage.log || true
