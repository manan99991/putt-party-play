name: iOS

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ INTERNAL_UNLOCK: "true" = TestFlight build is fully unlocked (Pro for every   │
# │ install: no ads/limits, all themes + tools). FLIP TO "false" BEFORE THE        │
# │ FIRST PRODUCTION SUBMISSION — this is the paid gate.                          │
# └─────────────────────────────────────────────────────────────────────────────┘
env:
  INTERNAL_UNLOCK: "true"

on:
  push:
    branches: [handytools]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

# Serialize iOS runs so they never race on the shared cert cache (a race makes several runs each
# create a new distribution cert, which eventually forces a revoke → "certificate revoked" email).
# Queue rather than cancel, so in-flight TestFlight uploads still finish.
concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  build:
    if: "${{ !contains(github.event.head_commit.message, 'Ship-Store=YES') }}"
    runs-on: macos-26
    defaults:
      run: { working-directory: ios }
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          ls /Applications | grep -i xcode
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios
      - name: Install XcodeGen + generate + resolve
        run: |
          set -o pipefail
          { brew install xcodegen && xcodegen generate && xcodebuild -resolvePackageDependencies -project HandyTools.xcodeproj -scheme HandyTools; } 2>&1 | tee setup.log
      - name: Build (simulator, unsigned)
        run: |
          set -o pipefail
          # Screenshots show what testers get: the same INTERNAL_UNLOCK flag as the TestFlight build.
          UNLOCK_FLAG=""; [ "$INTERNAL_UNLOCK" = "true" ] && UNLOCK_FLAG="SWIFT_ACTIVE_COMPILATION_CONDITIONS=\$(inherited) INTERNAL_UNLOCK"
          xcodebuild build \
            -project HandyTools.xcodeproj -scheme HandyTools \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO $UNLOCK_FLAG \
            -skipPackagePluginValidation -skipMacroValidation \
            2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD|\*\*" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Report built Info.plist permission strings
        working-directory: .
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path "*Debug-iphonesimulator/HandyTools.app" -maxdepth 6 | head -1)
          P="$APP/Info.plist"
          echo "built app plist: $P"
          { echo "=== $P ==="; plutil -p "$P" 2>&1 | grep -iE "Usage|GADApplication|CFBundleURLSchemes|UIBackgroundModes" || true; echo "--- presence ---"; } > plist-check.log
          summary=""
          for k in NSCameraUsageDescription NSMicrophoneUsageDescription NSSpeechRecognitionUsageDescription NSLocationWhenInUseUsageDescription NSMotionUsageDescription NSPhotoLibraryUsageDescription NSPhotoLibraryAddUsageDescription NSFaceIDUsageDescription; do
            if plutil -extract "$k" raw "$P" >/dev/null 2>&1; then r=OK; else r=MISS; fi
            echo "$r $k" >> plist-check.log; summary="$summary ${k#NS}=$r"
          done
          cat plist-check.log
          echo "::warning title=plist::$summary"
          bash .github/publish-log.sh ios-plist plist-check.log || true
      - name: Simulator screenshots of every tool
        run: |
          set -x
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path "*Debug-iphonesimulator/HandyTools.app" -maxdepth 6 | head -1)
          echo "APP=$APP"
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone 17 Pro") or x["name"].startswith("iPhone 16 Pro") or x["name"].startswith("iPhone")]
          c.sort(key=lambda x:(not x["name"].startswith("iPhone 17 Pro"), not x["name"].startswith("iPhone 16 Pro"), x["name"]))
          print(c[0]["udid"]); print(c[0]["name"], file=sys.stderr)')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          # Explicitly grant every permission a tool might ask for, so no system permission alert
          # pops during capture and lingers over later screenshots (grant all alone left mic undetermined).
          for p in all camera microphone photos location speech-recognition; do
            xcrun simctl privacy "$UDID" grant $p com.tenzy.toolkit 2>/dev/null || true
          done
          # Pre-answer the App Tracking Transparency prompt so it doesn't cover every screenshot
          xcrun simctl launch "$UDID" com.tenzy.toolkit -screenshots; sleep 4
          xcrun simctl spawn "$UDID" defaults write com.apple.AppTrackingTransparency.plist 2>/dev/null || true
          xcrun simctl terminate "$UDID" com.tenzy.toolkit || true
          mkdir -p shots
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          for mode in light dark; do
            xcrun simctl ui "$UDID" appearance $mode
            for r in home onboarding onboarding2 onboarding3 setup settings privacy paywall capture documents media cleanup voice translate instruments flashlight safety share; do
              xcrun simctl terminate "$UDID" com.tenzy.toolkit 2>/dev/null || true
              xcrun simctl launch "$UDID" com.tenzy.toolkit -screenshots -sample -route $r
              sleep 9
              xcrun simctl io "$UDID" screenshot shots/ios-$mode-$r.png
            done
          done
          ls -la shots
      - name: Publish screenshots
        if: always()
        working-directory: .
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: bash .github/publish-log.sh ios-shots ios/shots
      - name: Publish build log
        if: always()
        working-directory: .
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          { echo "== xcode"; ls /Applications | grep -i xcode; xcodebuild -version 2>&1; echo "== setup.log"; cat ios/setup.log 2>/dev/null; echo "== build.log"; cat ios/build.log 2>/dev/null; } > ios-full.log
          bash .github/publish-log.sh ios ios-full.log || true
          bash .github/publish-log.sh "ios-build-${GITHUB_RUN_ID}" ios-full.log || true

  # Full test gate. The deploy will NOT upload unless the engine unit tests and the every-tool
  # smoke suite pass. Regression tests for every shipped crash fix live in HandyToolsTests, so a
  # fixed crash cannot silently return in a later build. (ToolFlowTests run in the separate
  # `flowtests` job below — informational, never gating, because their synthetic inputs are flaky.)
  test:
    if: "${{ !contains(github.event.head_commit.message, 'Ship-Store=YES') }}"
    runs-on: macos-26
    defaults:
      run: { working-directory: ios }
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Install XcodeGen + generate + resolve
        run: |
          set -o pipefail
          { brew install xcodegen && xcodegen generate && xcodebuild -resolvePackageDependencies -project HandyTools.xcodeproj -scheme HandyTools; } 2>&1 | tee setup.log
      - name: Test (engine unit + smoke + LIVE hardware) — gates the deploy
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          c.sort(key=lambda x:x["name"]); print(c[-1]["udid"])')
          echo "simulator=$UDID"
          # Boot the sim and PRE-AUTHORIZE the app, so the live test drives the real camera / mic /
          # location permission + audio-callback paths (the ones the smoke run disables) with no
          # prompt. This is the check that would have caught the Pro Camera / Audio Lab crashes.
          xcrun simctl bootstatus "$UDID" -b || xcrun simctl boot "$UDID" || true
          for p in camera microphone photos location; do
            xcrun simctl privacy "$UDID" grant $p com.tenzy.toolkit 2>/dev/null || true
          done
          xcodebuild test \
            -project HandyTools.xcodeproj -scheme HandyTools \
            -destination "id=$UDID" \
            -only-testing:HandyToolsTests \
            -only-testing:HandyToolsUITests/ToolSmokeTests \
            -only-testing:HandyToolsUITests/LiveToolTests \
            -only-testing:HandyToolsUITests/ToolControlsReachableTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -skipPackagePluginValidation -skipMacroValidation \
            2>&1 | tee test.log | grep -E "error:|Test Case .*(passed|failed)|Executed .* test|TEST (SUCCEEDED|FAILED)|BUILD" || true
          grep -E "error:|Test Case .*failed|failed - " test.log | sed 's#/Users/runner/work/[^/]*/[^/]*/##' | sort -u | head -20 | sed 's/^/::error::/' || true
          grep -q "TEST SUCCEEDED" test.log
      - name: iPad smoke — every tool opens without crashing on iPad (gates the deploy)
        run: |
          set -o pipefail
          IPAD=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for k,v in d.items() if "iOS" in k for x in v if "iPad" in x["name"]]
          c.sort(key=lambda x:x["name"]); print(c[-1]["udid"] if c else "")')
          [ -n "$IPAD" ] || { echo "::error::no iPad simulator available"; exit 1; }
          echo "ipad simulator=$IPAD"
          xcrun simctl bootstatus "$IPAD" -b || xcrun simctl boot "$IPAD" || true
          for p in camera microphone photos location; do xcrun simctl privacy "$IPAD" grant $p com.tenzy.toolkit 2>/dev/null || true; done
          xcodebuild test \
            -project HandyTools.xcodeproj -scheme HandyTools \
            -destination "id=$IPAD" \
            -only-testing:HandyToolsUITests/ToolSmokeTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -skipPackagePluginValidation -skipMacroValidation \
            2>&1 | tee ipad.log | grep -E "error:|Test Case .*(passed|failed)|TEST (SUCCEEDED|FAILED)" || true
          grep -E "Test Case .*failed|failed - " ipad.log | sed 's#/Users/runner/work/[^/]*/[^/]*/##' | sort -u | head | sed 's/^/::error::/' || true
          grep -q "TEST SUCCEEDED" ipad.log
      - name: Publish test log
        if: always()
        working-directory: .
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          { echo "== test.log (results)"; grep -E "error:|Test Case .*(passed|failed)|Executed .* test|TEST (SUCCEEDED|FAILED)" ios/test.log 2>/dev/null | head -200;
            echo "== ipad.log (results)"; grep -E "error:|Test Case .*(passed|failed)|Executed .* test|TEST (SUCCEEDED|FAILED)|XCTAssert|failed - |Assertion" ios/ipad.log 2>/dev/null | head -200;
            echo "== ipad.log (tail)"; tail -120 ios/ipad.log 2>/dev/null; } > ios-test.log
          bash .github/publish-log.sh ios-test ios-test.log || true
          bash .github/publish-log.sh "ios-test-${GITHUB_RUN_ID}" ios-test.log || true

  # Per-tool flow tests — informational only. Nothing `needs` this job and it is allowed to fail
  # (continue-on-error), so a flaky synthetic-input flake here NEVER blocks TestFlight or the store
  # submit. It still runs on every push for visibility (failures surface as annotations).
  flowtests:
    if: "${{ !contains(github.event.head_commit.message, 'Ship-Store=YES') }}"
    continue-on-error: true
    runs-on: macos-26
    defaults:
      run: { working-directory: ios }
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Install XcodeGen + generate + resolve
        run: |
          set -o pipefail
          { brew install xcodegen && xcodegen generate && xcodebuild -resolvePackageDependencies -project HandyTools.xcodeproj -scheme HandyTools; } 2>&1 | tee setup.log
      - name: ToolFlowTests (informational — never gates the deploy)
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          c.sort(key=lambda x:x["name"]); print(c[-1]["udid"])')
          xcrun simctl bootstatus "$UDID" -b || xcrun simctl boot "$UDID" || true
          for p in camera microphone photos location; do
            xcrun simctl privacy "$UDID" grant $p com.tenzy.toolkit 2>/dev/null || true
          done
          xcodebuild test \
            -project HandyTools.xcodeproj -scheme HandyTools \
            -destination "id=$UDID" \
            -only-testing:HandyToolsUITests/ToolFlowTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -skipPackagePluginValidation -skipMacroValidation \
            2>&1 | tee flow.log | grep -E "Test Case .*(passed|failed)|Executed .* test|TEST (SUCCEEDED|FAILED)" || true
          grep -E "Test Case .*failed|failed - " flow.log | sed 's#/Users/runner/work/[^/]*/[^/]*/##' | sort -u | sed 's/^/::warning::/' || true
      - name: Publish flow-test log
        if: always()
        working-directory: .
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          { echo "== flow.log (results)"; grep -E "Test Case .*(passed|failed)|Executed .* test|TEST (SUCCEEDED|FAILED)" ios/flow.log 2>/dev/null | head -200; } > ios-flow.log
          bash .github/publish-log.sh ios-flow ios-flow.log || true

  # Runs only when App Store Connect secrets are present. Archives, signs with an
  # ASC API key via automatic signing, and uploads to TestFlight. Gated on `test`: a red
  # suite blocks the upload.
  testflight:
    needs: test
    # Decoupled from `build` so signing can be iterated fast — `archive` compiles the code too.
    # HOLD: build + test run on every push, but TestFlight upload happens ONLY when the commit
    # message contains the trailer line  Ship-Build: YES  — a distinctive token that is never written
    # in ordinary prose (so a commit that merely mentions shipping can't trigger a deploy by accident).
    # Default pushes build-and-test, never deploy.
    if: "${{ contains(github.event.head_commit.message, 'Ship-Build=YES') }}"
    runs-on: macos-26
    defaults:
      run: { working-directory: ios }
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - run: brew install xcodegen
      - name: Inject team id + generate + stamp build number
        run: |
          sed -i '' "s/YOUR_TEAM_ID/$TEAM_ID/g" project.yml HandyTools/Resources/Products.storekit
          xcodegen generate
          # GUARD: never upload a universal build by accident — the app must be iPhone-only (family 1).
          DF=$(xcodebuild -showBuildSettings -project HandyTools.xcodeproj -target HandyTools 2>/dev/null | awk -F'= ' '/ TARGETED_DEVICE_FAMILY /{print $2; exit}' | tr -d ' ')
          echo "TARGETED_DEVICE_FAMILY=$DF"
          [ "$DF" = "1,2" ] || { echo "::error::App is not universal (TARGETED_DEVICE_FAMILY=$DF) — expected 1,2 (iPhone+iPad)"; exit 1; }
          # Force a unique, ever-increasing CFBundleVersion directly into every generated Info.plist
          # (XcodeGen writes a literal "1", so a build-setting override alone doesn't take).
          BN=$(date +%s)
          for p in HandyTools ClipboardKeyboard ShareExtension StickyWidget; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BN" "$p/Info.plist" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BN" "$p/Info.plist"
          done
          V=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" HandyTools/Info.plist)
          echo "stamped build number: expected $BN, got $V"
          [ "$V" = "$BN" ] || { echo "BUILD NUMBER STAMP FAILED"; exit 1; }
      - name: Write ASC key + export fastlane auth env
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KP="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8_B64" | base64 -d > "$KP"
          echo "ASC_KEY_PATH=$KP" >> $GITHUB_ENV
          # spaceship / produce pick these up for API-key auth
          echo "APP_STORE_CONNECT_API_KEY_KEY_ID=$ASC_KEY_ID" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_API_KEY_ISSUER_ID=$ASC_ISSUER_ID" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_API_KEY_KEY_FILEPATH=$KP" >> $GITHUB_ENV
          echo "FASTLANE_HIDE_CHANGELOG=1" >> $GITHUB_ENV
          python3 - <<'PY' > asc_key.json
          import json, os
          kid = os.environ["ASC_KEY_ID"]
          p8 = open(os.path.expanduser(f"~/.appstoreconnect/private_keys/AuthKey_{kid}.p8")).read()
          print(json.dumps({"key_id": kid, "issuer_id": os.environ["ASC_ISSUER_ID"], "key": p8, "in_house": False}))
          PY
      - name: Reconcile subscriptions + prices (idempotent)
        continue-on-error: true   # never block the TestFlight upload if the ASC product API balks
        run: |
          set -o pipefail
          fastlane subscriptions 2>&1 | tee subs.log || true
      - name: Publish subscriptions log
        if: always()
        working-directory: .
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: bash .github/publish-log.sh ios-subs ios/subs.log || true
      - name: Write the shared distribution cert from secret
        env:
          IOS_DIST_P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
        run: |
          [ -n "$IOS_DIST_P12_B64" ] || { echo "IOS_DIST_P12_B64 secret is not set — add it in repo Settings → Secrets"; exit 1; }
          P12="$GITHUB_WORKSPACE/ios/dist.p12"
          echo "$IOS_DIST_P12_B64" | base64 -d > "$P12"
          BYTES=$(wc -c < "$P12")
          echo "wrote $P12 ($BYTES bytes)"
          [ "$BYTES" -gt 0 ] || { echo "decoded cert is empty — check the IOS_DIST_P12_B64 secret value"; exit 1; }
          echo "P12_PATH=$P12" >> "$GITHUB_ENV"
      - name: Fastlane build + upload to TestFlight
        env:
          P12_PASSWORD: tenzyshared
        run: |
          set -o pipefail
          fastlane beta 2>&1 | tee fastlane.log
      - name: Publish fastlane log (always)
        if: always()
        working-directory: .
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          { echo "===== fastlane.log errors ====="; grep -iE "error|fail|❌|could not|unable|invalid|no profiles|certificate|provisioning|entitlement|app group|Authentication|bundle id|\[!\]|Successfully|Uploaded|TestFlight|App ID" ios/fastlane.log 2>/dev/null | head -140; echo; echo "===== fastlane.log tail ====="; tail -90 ios/fastlane.log 2>/dev/null; } > ios-fastlane-err.log
          bash .github/publish-log.sh ios-archive ios-fastlane-err.log
          bash .github/publish-log.sh "ios-archive-${GITHUB_RUN_ID}" ios-fastlane-err.log

  # Public App Store submission (metadata + screenshots + submit for review). No binary is built
  # here — it reuses the build already on TestFlight. Double-gated so it NEVER runs by accident:
  #   - repo variable  STORE_SUBMIT_ENABLED = true
  #   - commit message contains the trailer  Ship-Store=YES
  # Release is held for a manual tap after approval (automatic_release: false in the Fastfile).
  # Metadata + screenshots + submit-for-review is a pure App Store Connect API call — no Xcode,
  # no Mac needed. Runs on ubuntu (fast, abundant runners) and does NOT depend on the macOS build/
  # test jobs, so a scarce/cancelled Mac runner can never block the submit. Gated on the Ship-Store
  # marker in the commit subject.
  store:
    if: "${{ contains(github.event.head_commit.message, 'Ship-Store=YES') }}"
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: ios }
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3" }
      - name: Install fastlane
        run: gem install fastlane --no-document
      - name: Write ASC key + export fastlane auth env
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KP="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8_B64" | base64 -d > "$KP"
          echo "ASC_KEY_PATH=$KP" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_API_KEY_KEY_ID=$ASC_KEY_ID" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_API_KEY_ISSUER_ID=$ASC_ISSUER_ID" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_API_KEY_KEY_FILEPATH=$KP" >> $GITHUB_ENV
          echo "FASTLANE_HIDE_CHANGELOG=1" >> $GITHUB_ENV
      - name: Fastlane deliver (metadata + screenshots + submit for review)
        run: |
          set -o pipefail
          fastlane release 2>&1 | tee deliver.log
      - name: Publish deliver log (always)
        if: always()
        working-directory: .
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          { echo "===== deliver.log ====="; grep -iE "error|fail|❌|invalid|missing|too long|rejected|\[!\]|Successfully|submitted|Waiting For Review|screenshots|metadata" ios/deliver.log 2>/dev/null | head -160; echo; echo "===== tail ====="; tail -80 ios/deliver.log 2>/dev/null; } > ios-deliver.log
          bash .github/publish-log.sh ios-deliver ios-deliver.log || true

  # STAGE: push metadata + screenshots to the editable version WITHOUT submitting (STAGE_ONLY=true),
  # and reconcile the subscription (price, availability, App Review screenshot) so it is ready to be
  # included in the review submission. Leaves the final "Add for Review" tap to Manan. Gated on the
  # Ship-Stage=YES marker; pure ASC API (ubuntu, no Mac).
  stage:
    if: "${{ contains(github.event.head_commit.message, 'Ship-Stage=YES') }}"
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: ios }
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
      STAGE_ONLY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3" }
      - name: Install fastlane
        run: gem install fastlane --no-document
      - name: Write ASC key + export fastlane auth env
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KP="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8_B64" | base64 -d > "$KP"
          echo "ASC_KEY_PATH=$KP" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_API_KEY_KEY_ID=$ASC_KEY_ID" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_API_KEY_ISSUER_ID=$ASC_ISSUER_ID" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_API_KEY_KEY_FILEPATH=$KP" >> $GITHUB_ENV
          echo "FASTLANE_HIDE_CHANGELOG=1" >> $GITHUB_ENV
      - name: Reconcile subscription (price, availability, review screenshot)
        run: fastlane subscriptions 2>&1 | tee subs.log || true
      - name: Fastlane deliver — STAGE (metadata + screenshots, NO submit)
        run: |
          set -o pipefail
          fastlane release 2>&1 | tee deliver.log
      - name: Publish stage log (always)
        if: always()
        working-directory: .
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          { echo "===== deliver.log ====="; grep -iE "error|fail|❌|invalid|missing|too long|rejected|\[!\]|Successfully|Staged|screenshots|metadata|review screenshot|upload" ios/deliver.log 2>/dev/null | head -160; echo; echo "===== subs ====="; tail -50 ios/subs.log 2>/dev/null; echo; echo "===== deliver tail ====="; tail -60 ios/deliver.log 2>/dev/null; } > ios-stage.log
          bash .github/publish-log.sh ios-stage ios-stage.log || true
