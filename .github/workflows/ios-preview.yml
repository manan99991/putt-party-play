name: iOS App Store video

# Films the App Store preview from the real app: builds for the 6.9-inch simulator, records the screen while
# PreviewTourTests walks the tour, then trims and sizes it to Apple's preview spec (886x1920, 30 fps, H.264,
# AAC stereo, 15-30 s). Run by hand; it never deploys anything.
on:
  push:
    paths: ["ios/.preview"]   # touch this file to film a new one
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: xcode-27
    defaults:
      run: { working-directory: ios }
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Build for testing (6.9-inch)
        run: |
          set -o pipefail
          brew install xcodegen ffmpeg && xcodegen generate
          xcodebuild -resolvePackageDependencies -project HandyTools.xcodeproj -scheme HandyTools
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          allv=[x for k,v in d.items() if "iOS" in k for x in v]
          c=[x for x in allv if "Pro Max" in x["name"]]
          c.sort(key=lambda x:(not x["name"].startswith("iPhone 17"), x["name"]))
          print(c[0]["udid"])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcodebuild build-for-testing -project HandyTools.xcodeproj -scheme HandyTools -destination "id=$UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -skipPackagePluginValidation -skipMacroValidation \
            2>&1 | tee build.log | grep -E "error:|TEST BUILD|BUILD" || true
          grep -qE "TEST BUILD SUCCEEDED|BUILD SUCCEEDED" build.log
      - name: Film the tour
        timeout-minutes: 30
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          mkdir -p preview
          # Install + warm up once, so the recording starts on a launched app, not a cold boot.
          TEST_RUNNER_PREVIEW_TOUR=warm xcodebuild test-without-building -project HandyTools.xcodeproj -scheme HandyTools -destination "id=$UDID" \
            -derivedDataPath build -only-testing:HandyToolsUITests/PreviewTourTests CODE_SIGNING_ALLOWED=NO >/dev/null 2>&1 || true
          # The recorder starts when the tour says TOUR-START (the test then holds on Home for 6 s while it spins up)
          # and stops at TOUR-END, so the film holds the tour and nothing else. Marks arrive live through a pty.
          script -q /dev/null env TEST_RUNNER_PREVIEW_TOUR=1 xcodebuild test-without-building -project HandyTools.xcodeproj -scheme HandyTools \
            -destination "id=$UDID" -derivedDataPath build -only-testing:HandyToolsUITests/PreviewTourTests CODE_SIGNING_ALLOWED=NO 2>&1 \
            | while IFS= read -r line; do
                for m in TOUR-START PLAY DEMO-TAP DEMO-RESULT TOUR-END; do
                  case "$line" in *"$m"*) [ -f "preview/$m.t" ] || python3 -c 'import time;print(time.time())' > "preview/$m.t" ;; esac
                done
                case "$line" in
                  *TOUR-START*) [ -f preview/rec.pid ] || { xcrun simctl io "$UDID" recordVideo --codec h264 --force preview/raw.mov & echo $! > preview/rec.pid; } ;;
                  *TOUR-END*) sleep 1; [ -f preview/rec.pid ] && kill -INT "$(cat preview/rec.pid)" ;;
                esac
                case "$line" in *error:*|*"Test Case"*|*TEST\ *) echo "$line";; esac
              done
          sleep 3
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 preview/raw.mov)
          # Video times counted back from its end (= TOUR-END + 1 s). Show 1 s of Home before PLAY; the demo's wait
          # on this slow simulator, if long, is cut to a beat.
          python3 - <<PY
          import os
          d=float("$D" or 0)
          def t(m): p=f"preview/{m}.t"; return float(open(p).read()) if os.path.exists(p) else None
          end=t("TOUR-END") or 0
          def at(m):
              x=t(m); return None if x is None else d-(end+1-x)
          play=at("PLAY") or max(0,d-30); tap=at("DEMO-TAP"); res=at("DEMO-RESULT")
          s=max(0, play-1.0); e=d
          segs=[[s, tap+1.5], [res-0.4, e]] if tap is not None and res is not None and res-tap > 4 else [[s, e]]
          total=sum(b-a for a,b in segs)
          if total > 30: segs[-1][1] -= total-30
          open("preview/cut.txt","w").write(" ".join(f"{a:.2f} {b:.2f}" for a,b in segs)+"\n")
          print("recording", d, "s; segments", segs, "length", sum(b-a for a,b in segs))
          PY
          ls -la preview
      - name: Make it App Store size
        run: |
          cd preview
          read -a C < cut.txt || true
          echo "segments: ${C[*]}"
          F=""; L=""; n=0; LEN=0
          for ((k=0; k<${#C[@]}; k+=2)); do
            F="$F[0:v]trim=start=${C[k]}:end=${C[k+1]},setpts=PTS-STARTPTS[s$n];"; L="$L[s$n]"; n=$((n+1))
            LEN=$(python3 -c "print($LEN + ${C[k+1]} - ${C[k]})")
          done
          F="$F${L}concat=n=$n:v=1:a=0,scale=886:1920:force_original_aspect_ratio=decrease,pad=886:1920:(ow-iw)/2:(oh-ih)/2,fps=30[v]"
          ffmpeg -y -i raw.mov -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 -filter_complex "$F" -map "[v]" -map 1:a \
            -c:v libx264 -profile:v high -pix_fmt yuv420p -b:v 10M -c:a aac -b:a 256k -t $LEN -movflags +faststart \
            tenzy-preview-6.9.mp4
          for t in 1 4 8 12 16 20 24 28; do ffmpeg -y -ss $t -i tenzy-preview-6.9.mp4 -frames:v 1 -vf scale=443:-1 frame-$t.png >/dev/null 2>&1 || true; done
          ffprobe -v error -show_entries format=duration:stream=width,height,codec_name -of compact tenzy-preview-6.9.mp4
          rm -f raw.mov
      - name: Publish
        if: always()
        working-directory: .
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: bash .github/publish-log.sh ios-preview ios/preview
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios-preview, path: ios/preview, retention-days: 7 }
