name: QA lab — real files

# Every tool's output on real photos and files, scored against the right answers. Its own workflow so it always
# runs (never skipped by the release job), the newest push wins, and it never builds or ships anything.
on:
  push:
    branches: [handytools]
    paths: ["ios/HandyTools/**", "ios/HandyToolsTests/**", "ios/RealPhotos/**", ".github/fetch-real-photos.py", ".github/workflows/qa-lab.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qa-lab
  cancel-in-progress: false   # a running score finishes; only the newest waiting run is kept

jobs:
  accuracy:
    runs-on: xcode-27
    timeout-minutes: 120
    defaults:
      run: { working-directory: ios }
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Generate project
        run: brew install xcodegen && xcodegen generate && xcodebuild -resolvePackageDependencies -project HandyTools.xcodeproj -scheme HandyTools
      - name: Accuracy on real photos (receipts, posters, menus, boards; informational)
        env: { TEST_PHOTOS_KEY: "${{ secrets.TEST_PHOTOS_KEY }}" }
        run: |
          set -o pipefail
          REAL="$RUNNER_TEMP/real"; mkdir -p "$REAL"
          python3 -m pip install -q --break-system-packages pyarrow 2>/dev/null || python3 -m pip install -q pyarrow || true
          python3 ../.github/fetch-real-photos.py "$REAL" 120 || true
          # Manan's own test photos (some are web/stock images, so they're kept encrypted in the repo).
          if [ -n "$TEST_PHOTOS_KEY" ]; then
            OSSL=$( [ -x /opt/homebrew/opt/openssl@3/bin/openssl ] && echo /opt/homebrew/opt/openssl@3/bin/openssl || echo openssl )
            $OSSL enc -d -aes-256-cbc -pbkdf2 -iter 100000 -md sha256 -in RealPhotos/private.zip.enc -out "$RUNNER_TEMP/private.zip" -pass env:TEST_PHOTOS_KEY \
              && mkdir -p "$REAL/private" && unzip -q -o "$RUNNER_TEMP/private.zip" -d "$REAL/private" && ls "$REAL/private" | wc -l
          else echo "::warning title=accuracy::TEST_PHOTOS_KEY secret not set — only public photos scored"; fi
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          c.sort(key=lambda x:x["name"]); print(c[-1]["udid"])')
          rm -f "$RUNNER_TEMP/accuracy.txt"
          TEST_RUNNER_REAL_PHOTOS="$REAL" TEST_RUNNER_GOLDEN="$PWD/RealPhotos/golden.json" TEST_RUNNER_ACCURACY_REPORT="$RUNNER_TEMP/accuracy.txt" xcodebuild test \
            -project HandyTools.xcodeproj -scheme HandyTools \
            -destination "id=$UDID" \
            -only-testing:HandyToolsTests/RealPhotoAccuracyTests \
            -only-testing:HandyToolsTests/PrivatePhotoAccuracyTests \
            -only-testing:HandyToolsTests/ToughPhotoTests \
            -only-testing:HandyToolsTests/ToolOutputQualityTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -skipPackagePluginValidation -skipMacroValidation \
            2>&1 | tee accuracy-run.log | grep -E "ACC\| SCORE|error:|Test Case .*(passed|failed)|TEST (SUCCEEDED|FAILED)" || true
          { cat "$RUNNER_TEMP/accuracy.txt" 2>/dev/null || grep -h "ACC| " accuracy-run.log | sed 's/^.*ACC| //'; } > accuracy.txt
          grep -E "failed - " accuracy-run.log | head -5 >> accuracy.txt || true
          head -3 accuracy.txt
      - name: Publish accuracy report
        if: always()
        working-directory: .
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          [ -f ios/accuracy.txt ] && bash .github/publish-log.sh ios-accuracy ios/accuracy.txt || true
      - name: Scores in the run summary
        if: always()
        run: |
          { echo "## Real-file scores"; echo '```'; grep -E "^SCORE" accuracy.txt 2>/dev/null || echo "no scores"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
