name: Cert Export (one-time)

# One-time helper: reads the distribution .p12 Tenzy already signs with out of the Actions cache and
# returns it ENCRYPTED to a caller-held public key, so only useless ciphertext ever appears in logs
# or artifacts (safe even on a public repo). Runs only when this file changes on handytools (so it
# can reach that branch's cache); delete it afterwards. Touches no ios/** or android/** path, so it
# never triggers the app build.
on:
  push:
    branches: [handytools]
    paths: ['.github/workflows/cert-export.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Restore the distribution cert cache
        uses: actions/cache/restore@v4
        with:
          path: ios/cert-cache
          key: tenzy-dist-cert-v3
      - name: Encrypt the .p12 to the caller's public key
        env:
          PUBKEY_B64: ""
        run: |
          set -e
          if [ ! -f ios/cert-cache/dist.p12 ]; then echo "NO_P12_IN_CACHE"; ls -la ios/cert-cache || true; exit 1; fi
          mkdir -p out
          echo "$PUBKEY_B64" | base64 -d > pub.pem
          openssl rand -out aeskey.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in ios/cert-cache/dist.p12 -out out/dist.p12.enc -pass file:aeskey.bin
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in aeskey.bin -out out/aeskey.enc
          echo "p12 bytes: $(wc -c < ios/cert-cache/dist.p12)"
      - name: Upload ciphertext only
        uses: actions/upload-artifact@v4
        with:
          name: dist-enc
          path: out/*.enc
          retention-days: 1
