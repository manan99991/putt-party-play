name: Cert Export (one-time)

# One-time helper: pulls the distribution .p12 Tenzy already signs with out of the Actions cache
# and hands it back ENCRYPTED (only ciphertext ever leaves CI, safe even on a public repo). Used to
# move the cert into a durable secret shared by both apps, so nothing ever revokes/recreates again.
on:
  workflow_dispatch:
    inputs:
      passphrase:
        description: Passphrase used to encrypt the exported .p12 (provided by the caller)
        required: true

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Restore the distribution cert cache
        uses: actions/cache/restore@v4
        with:
          path: ios/cert-cache
          key: tenzy-dist-cert-v3
      - name: Encrypt the .p12 for return
        env:
          PASS: ${{ inputs.passphrase }}
        run: |
          echo "::add-mask::$PASS"
          if [ ! -f ios/cert-cache/dist.p12 ]; then
            echo "NO_P12_IN_CACHE"
            exit 1
          fi
          mkdir -p out
          openssl enc -aes-256-cbc -pbkdf2 -salt -in ios/cert-cache/dist.p12 -out out/dist.p12.enc -pass env:PASS
          echo "bytes: $(wc -c < ios/cert-cache/dist.p12)"
      - name: Upload ciphertext only
        uses: actions/upload-artifact@v4
        with:
          name: dist-enc
          path: out/dist.p12.enc
          retention-days: 1
