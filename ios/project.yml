# XcodeGen spec. Run:  brew install xcodegen && cd ios && xcodegen && open HandyTools.xcodeproj
# Change BUNDLE_PREFIX + TEAM_ID once; everything else derives from them.
name: HandyTools
options:
  bundleIdPrefix: com.tenzy
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    # Swift 5 language mode: the code is written for minimal concurrency and is thread-safe, but
    # Swift 6 mode inserts runtime actor-isolation assertions that FALSELY crash when AVFoundation
    # calls our audio render/tap callbacks on its own realtime thread (SIGNAL 5, dispatch_assert_queue).
    # Swift 5 mode removes those false-positive runtime checks for the whole app, killing the entire
    # class of audio-callback crashes at once instead of annotating each callback individually.
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "YOUR_TEAM_ID"      # <- Apple Developer team id
    MARKETING_VERSION: "1.2.23"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    OTHER_LDFLAGS: "-ObjC"                 # required by Google Mobile Ads

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "12.0.0"

targets:
  HandyTools:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tenzy.toolkit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - path: HandyTools
      - path: Shared
    dependencies:
      - package: GoogleMobileAds
      - target: ShareExtension
      - target: StickyWidget
      - sdk: VisionKit.framework
      - sdk: Vision.framework
    entitlements:
      path: HandyTools/HandyTools.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tenzy.toolkit]
    info:
      path: HandyTools/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Tenzy
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio]   # Rest keeps playing sleep sounds / listening for snoring with the screen off
        CFBundleURLTypes:
          - CFBundleURLName: com.tenzy.toolkit
            CFBundleURLSchemes: [tenzy]
        # --- AdMob (live Tenzy app id) ---
        GADApplicationIdentifier: ca-app-pub-5414801919054534~3553659163
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
        NSUserTrackingUsageDescription: Used to show you ads that are more relevant. Say no and you still get ads, just less relevant ones.
        # --- Tool permissions ---
        NSCameraUsageDescription: Needed for Scan, Capture, Color Vision, the magnifier, mirror and light meter. Frames are processed on your phone and never uploaded.
        NSMicrophoneUsageDescription: Needed for the sound meter and voice tools. Levels are measured on your phone; nothing is uploaded.
        NSLocationWhenInUseUsageDescription: Needed for the compass (true north), altitude and the GPS dashboard. Your location stays on this phone.
        NSMotionUsageDescription: Needed for the level, barometer/altimeter and metal detector readings.
        NSSpeechRecognitionUsageDescription: Needed to transcribe your voice to text. Audio is processed on your phone and never uploaded.
        NSPhotoLibraryUsageDescription: Needed to read text from screenshots, view or strip photo metadata, and find large or duplicate photos and videos you choose to remove. iOS always asks you to confirm a deletion.
        NSPhotoLibraryAddUsageDescription: Needed to save cleaned photos and scanned documents.
        NSFaceIDUsageDescription: Used to unlock your Secure Vault so only you can open your private notes and photos.
        NSSupportsLiveActivities: true

  ShareExtension:
    type: app-extension
    platform: iOS
    settings:
      base: { PRODUCT_BUNDLE_IDENTIFIER: com.tenzy.toolkit.share }
    sources: [ShareExtension, Shared]
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tenzy.toolkit]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Save to Clips
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1

  StickyWidget:
    type: app-extension
    platform: iOS
    settings:
      base: { PRODUCT_BUNDLE_IDENTIFIER: com.tenzy.toolkit.widget }
    sources: [StickyWidget, Shared]
    entitlements:
      path: StickyWidget/StickyWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tenzy.toolkit]
    info:
      path: StickyWidget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Sticky Note
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # In-build quality checker: engine unit tests + an every-tool UI smoke that opens all 30 tools.
  HandyToolsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HandyToolsTests]
    dependencies:
      - target: HandyTools
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  HandyToolsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HandyToolsUITests]
    dependencies:
      - target: HandyTools
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HandyTools:
    build:
      targets:
        HandyTools: all
        HandyToolsTests: [test]
        HandyToolsUITests: [test]
    test:
      targets:
        - HandyToolsTests
        - HandyToolsUITests
