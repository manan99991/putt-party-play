# XcodeGen spec. Run:  brew install xcodegen && cd ios && xcodegen && open HandyTools.xcodeproj
# Change BUNDLE_PREFIX + TEAM_ID once; everything else derives from them.
name: HandyTools
options:
  bundleIdPrefix: com.tenzy
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    # Swift 5 language mode: the code is written for minimal concurrency and is thread-safe, but
    # Swift 6 mode inserts runtime actor-isolation assertions that FALSELY crash when AVFoundation
    # calls our audio render/tap callbacks on its own realtime thread (SIGNAL 5, dispatch_assert_queue).
    # Swift 5 mode removes those false-positive runtime checks for the whole app, killing the entire
    # class of audio-callback crashes at once instead of annotating each callback individually.
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "YOUR_TEAM_ID"      # <- Apple Developer team id
    MARKETING_VERSION: "1.2.65"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_STRICT_CONCURRENCY: minimal
    OTHER_LDFLAGS: "-ObjC"                 # required by Google Mobile Ads

packages:
  SwiftOGG:
    # libopus/libogg wrapper (Element/Matrix). Decodes WhatsApp/Telegram Ogg-Opus voice notes to m4a.
    # No tagged release upstream; its binary deps (vector-im opus-swift 0.8.4 / ogg-swift 0.8.3) are versioned.
    url: https://github.com/element-hq/swift-ogg
    branch: main
  Unrar:
    # Local package: UnRAR 6.12 freeware source (see its Package.swift for the licence paragraph) for .rar and .cbr.
    path: Packages/Unrar
  StbVorbis:
    # Local package: stb_vorbis (public domain) to play Ogg Vorbis files in File Opener.
    path: Packages/StbVorbis
  SWCompression:
    # Pure-Swift 7-Zip (LZMA/LZMA2), BZip2 and LZ4 (MIT). File Opener tier 2: .7z, .cb7 comics, .bz2, .tbz2.
    url: https://github.com/tsolomko/SWCompression
    exactVersion: 4.8.6
  BitByteData:
    # SWCompression's own dependency, held at 2.0.4: 2.1.0 asks for iOS 17 while SWCompression's targets say 15.
    url: https://github.com/tsolomko/BitByteData
    exactVersion: 2.0.4

targets:
  HandyTools:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tenzy.toolkit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"   # universal: iPhone + iPad
    sources:
      - path: HandyTools
      - path: Shared
      - path: OutsideShared
    dependencies:
      - package: SwiftOGG
      - package: SWCompression
      - package: BitByteData
      - package: StbVorbis
      - package: Unrar
      - target: ShareExtension
      - target: StickyWidget
      - sdk: VisionKit.framework
      - sdk: Vision.framework
      - sdk: libsqlite3.tbd
    entitlements:
      path: HandyTools/HandyTools.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tenzy.toolkit]
        com.apple.developer.weatherkit: true
    info:
      path: HandyTools/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Tenzy
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio, fetch, processing, location]   # audio: Rest keeps playing with the screen off · fetch: smart alert checks · processing: the photo index finishes while charging · location: "Save my spot automatically" (While Using + a background location session, only when switched on)
        BGTaskSchedulerPermittedIdentifiers: [com.tenzy.toolkit.smartalerts, com.tenzy.toolkit.photoindex, com.tenzy.toolkit.smartruns]
        CFBundleURLTypes:
          - CFBundleURLName: com.tenzy.toolkit
            CFBundleURLSchemes: [tenzy]
        # "Open in Tenzy": Tenzy appears in the Share sheet / "Open in…" for ANY file (Files, Downloads, Mail,
        # Safari, WhatsApp…). Alternate rank, so it never takes over as the default app for a type.
        # Files' "Open With" only lists apps that name the type itself (catch-alls like public.data are ignored there),
        # so each kind File Opener handles is named, plus the catch-all for the Share sheet.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.midi-audio, public.mp3, public.mpeg-4-audio, com.apple.m4a-audio, com.microsoft.waveform-audio, public.aiff-audio, org.xiph.flac, org.xiph.ogg, org.xiph.opus, public.aac-audio]
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie, public.mpeg-4, com.apple.quicktime-movie, public.avi, org.webmproject.webm]
          - CFBundleTypeName: Documents
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf, public.plain-text, public.rtf, public.html, public.json, public.xml, public.comma-separated-values-text, org.openxmlformats.wordprocessingml.document, org.openxmlformats.spreadsheetml.sheet, org.openxmlformats.presentationml.presentation, com.microsoft.word.doc, com.microsoft.excel.xls, com.microsoft.powerpoint.ppt, com.apple.iwork.pages.sections, com.apple.iwork.numbers.sections, com.apple.iwork.keynote.sections, org.idpf.epub-container, public.vcard, com.apple.ical.ics]
          - CFBundleTypeName: Pictures
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image, public.heic, public.jpeg, public.png, com.compuserve.gif, org.webmproject.webp, public.svg-image]
          - CFBundleTypeName: Archives
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive, org.gnu.gnu-zip-archive, public.tar-archive, public.archive, org.tukaani.xz-archive, com.tenzy.tgz, com.tenzy.apk, com.rarlab.rar-archive, org.7-zip.7-zip-archive, public.bzip2-archive]
          - CFBundleTypeName: Books and comics
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container, com.tenzy.mobi, com.tenzy.azw3, com.tenzy.azw, com.tenzy.fb2, com.tenzy.cbz, com.tenzy.cbr, com.tenzy.pdb, com.tenzy.chm]
          - CFBundleTypeName: Email
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.apple.mail.email, com.tenzy.emlx, com.tenzy.msg, com.tenzy.tnef]
          - CFBundleTypeName: Code and data
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.source-code, public.script, public.shell-script, public.log, public.yaml, com.tenzy.tsv, com.tenzy.sqlite, com.tenzy.netpbm, com.tenzy.xps]
          - CFBundleTypeName: More pictures and video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.camera-raw-image, com.adobe.photoshop-image, com.truevision.tga-image, public.avif, com.microsoft.ico, com.microsoft.bmp, public.tiff, public.3gpp, public.mpeg-2-transport-stream, com.tenzy.mkv]
          - CFBundleTypeName: Any file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.item, public.content, public.data]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.tenzy.mobi
            UTTypeDescription: Mobipocket eBook
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [mobi, prc]
          - UTTypeIdentifier: com.tenzy.azw3
            UTTypeDescription: Kindle eBook (KF8)
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [azw3]
          - UTTypeIdentifier: com.tenzy.azw
            UTTypeDescription: Kindle eBook
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [azw]
          - UTTypeIdentifier: com.tenzy.fb2
            UTTypeDescription: FictionBook
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [fb2]
          - UTTypeIdentifier: com.tenzy.cbz
            UTTypeDescription: Comic book (ZIP)
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [cbz]
          - UTTypeIdentifier: com.tenzy.cbr
            UTTypeDescription: Comic book (RAR)
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [cbr, cb7]
          - UTTypeIdentifier: com.tenzy.pdb
            UTTypeDescription: Palm eBook
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [pdb]
          - UTTypeIdentifier: com.tenzy.emlx
            UTTypeDescription: Apple Mail message
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [emlx]
          - UTTypeIdentifier: com.tenzy.msg
            UTTypeDescription: Outlook message
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [msg, oft]
          - UTTypeIdentifier: com.tenzy.tnef
            UTTypeDescription: Outlook attachments (winmail.dat)
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [tnef]
              public.mime-type: [application/ms-tnef, application/vnd.ms-tnef]
          - UTTypeIdentifier: com.tenzy.tsv
            UTTypeDescription: Delimited table
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [tsv, psv, ssv, tab]
          - UTTypeIdentifier: com.tenzy.sqlite
            UTTypeDescription: SQLite database
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [sqlite, sqlite3, db, db3]
          - UTTypeIdentifier: com.tenzy.netpbm
            UTTypeDescription: Netpbm image
            UTTypeConformsTo: [public.image]
            UTTypeTagSpecification:
              public.filename-extension: [pbm, pgm, ppm, pnm]
          - UTTypeIdentifier: com.tenzy.chm
            UTTypeDescription: Windows help file
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [chm]
              public.mime-type: [application/vnd.ms-htmlhelp]
          - UTTypeIdentifier: com.tenzy.xps
            UTTypeDescription: XPS document
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [xps, oxps]
          - UTTypeIdentifier: com.tenzy.tgz
            UTTypeDescription: Compressed TAR
            UTTypeConformsTo: [public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [tgz, txz, tbz, tbz2, taz]
          - UTTypeIdentifier: com.tenzy.apk
            UTTypeDescription: Android app package
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [apk, aab]
          - UTTypeIdentifier: com.tenzy.mkv
            UTTypeDescription: Matroska video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [mkv, mka, webm]
        LSSupportsOpeningDocumentsInPlace: false
        # --- Tool permissions ---
        NSCameraUsageDescription: Needed for Scan, Capture, Color Vision, the magnifier, mirror and light meter. Frames are processed on your phone and never uploaded.
        NSMicrophoneUsageDescription: Needed for the sound meter and voice tools. Levels are measured on your phone; nothing is uploaded.
        NSAppleMusicUsageDescription: Lets you add a song from your Music app to a video you make. Songs are read on your phone and never uploaded.
        NSLocationWhenInUseUsageDescription: Needed for the compass (true north), altitude, the GPS dashboard, saving where you parked (and, if you switch it on, saving it automatically when you stop driving), and to put where you are into a tool when you tap Location. It stays on your phone and is only shared if you send it.
        NSMotionUsageDescription: Needed for the level, barometer/altimeter and metal detector readings, and to tell when you stop driving so your parking spot saves by itself (only if you switch that on). It stays on your phone.
        NSSpeechRecognitionUsageDescription: Needed to transcribe your voice to text. Audio is processed on your phone and never uploaded.
        NSPhotoLibraryUsageDescription: Needed to read text from screenshots, view or strip photo metadata, and find large or duplicate photos and videos you choose to remove. iOS always asks you to confirm a deletion.
        NSPhotoLibraryAddUsageDescription: Needed to save cleaned photos and scanned documents.
        NSFaceIDUsageDescription: Used to unlock your Secure Vault so only you can open your private notes and photos.
        NSContactsUsageDescription: Needed to find duplicate contacts, merge them without losing a number, back them up to a file, and copy or move them between your accounts. Your contacts stay on this phone and are never uploaded.
        NSCalendarsWriteOnlyAccessUsageDescription: Needed so Tenzy can add the events it reads from your posters and invites straight to your calendar when you tap Add all. It only adds; it never reads your calendar.
        NSRemindersFullAccessUsageDescription: Needed so the thinking tools can add your tasks straight to Reminders with one tap. Only the tasks you add are written; nothing is read back or uploaded.
        NSRemindersUsageDescription: Needed so the thinking tools can add your tasks straight to Reminders with one tap. Only the tasks you add are written; nothing is read back or uploaded.
        NSSupportsLiveActivities: true

  ShareExtension:
    type: app-extension
    platform: iOS
    settings:
      base: { PRODUCT_BUNDLE_IDENTIFIER: com.tenzy.toolkit.share }
    sources:
      - ShareExtension
      - Shared
      # The chain runner and the engines it calls, so a saved tool runs right inside the share sheet.
      # (Video tools are not offered there; see ShareExtension/EngineShims.swift.)
      - HandyTools/Engines/ChainRunner.swift
      - HandyTools/Engines/SheetPeriod.swift
      - HandyTools/Engines/NumberWatch.swift
      - HandyTools/Engines/ChainExtras.swift
      - HandyTools/Engines/ChainFun.swift
      - HandyTools/Engines/StickerStudio.swift
      - HandyTools/Engines/PixelArt.swift
      - HandyTools/Engines/DocEngine.swift
      # Signing tools sign on the form's own lines, in the share sheet too.
      - HandyTools/Engines/SignSpots.swift
      - HandyTools/Engines/PDFOverlay.swift
      - HandyTools/Localizer.swift
      - HandyTools/Engines/DataGrab.swift
      - HandyTools/Engines/TextTools.swift
      - HandyTools/Engines/TextTidy.swift
      - HandyTools/Engines/RoutePlan.swift
      - HandyTools/Engines/SizeTarget.swift
      - HandyTools/Engines/ImageStudio.swift
      - HandyTools/Engines/PassportPhoto.swift
      - HandyTools/Engines/PassportCheck.swift
      - HandyTools/Engines/GrayPixels.swift
      - HandyTools/Engines/Scrubber.swift
      - HandyTools/Engines/ScamAnalyzer.swift
      - HandyTools/Engines/LinkCleaner.swift
      - HandyTools/Engines/PriceBrain.swift
      - HandyTools/Engines/Identifier.swift
      - HandyTools/Engines/SceneDescriber.swift
      - HandyTools/Engines/PageFlatten.swift
      # The email / message composer, so a tool that ends with "Email it" can do that from the share sheet too.
      - HandyTools/Tools/BuilderSend.swift
      - HandyTools/Tools/BuilderStyle.swift
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tenzy.toolkit]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Tenzy
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 20
              # PDFs (and other files, which the sheet politely turns away) so a PDF tool runs from any app's Share menu.
              NSExtensionActivationSupportsFileWithMaxCount: 10

  StickyWidget:
    type: app-extension
    platform: iOS
    settings:
      base: { PRODUCT_BUNDLE_IDENTIFIER: com.tenzy.toolkit.widget }
    sources: [StickyWidget, Shared, OutsideShared]   # OutsideShared: Control Center / Lock Screen actions (app + widgets only)
    entitlements:
      path: StickyWidget/StickyWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tenzy.toolkit]
    info:
      path: StickyWidget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Sticky Note
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # In-build quality checker: engine unit tests + an every-tool UI smoke that opens all 30 tools.
  HandyToolsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HandyToolsTests]
    dependencies:
      - target: HandyTools
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  HandyToolsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HandyToolsUITests]
    dependencies:
      - target: HandyTools
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HandyTools:
    build:
      targets:
        HandyTools: all
        HandyToolsTests: [test]
        HandyToolsUITests: [test]
    test:
      targets:
        - HandyToolsTests
        - HandyToolsUITests
