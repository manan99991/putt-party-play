<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2b3b22;font-family:Fredoka,system-ui,sans-serif;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
#gl,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:auto}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:5}
.pills{display:flex;gap:8px}
.pill{background:rgba(20,36,18,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;border-radius:14px;padding:6px 14px;text-align:center;min-width:64px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.pill small{display:block;font-size:11px;letter-spacing:.12em;opacity:.75;font-weight:600}
.pill b{font-size:22px;line-height:1.05;font-weight:700}
.pill.name{font-size:17px;font-weight:700;padding:6px 16px;letter-spacing:.02em}
.pill.coin b{color:#ffd65a}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 18px);text-align:center;color:#fff;font-weight:600;font-size:15px;text-shadow:0 2px 6px rgba(0,0,0,.6);pointer-events:none;z-index:5;transition:opacity .4s}
.card{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.96);width:min(88vw,380px);background:#fffdf5;border-radius:24px;padding:22px 20px 20px;text-align:center;box-shadow:0 18px 48px rgba(0,0,0,.35);z-index:10;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s}
.card.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.card .kicker{font-size:13px;letter-spacing:.16em;font-weight:700;color:#2c8443}
.card h1{margin:4px 0 6px;font-size:30px;color:#1f3b24}
.card p{margin:0 0 16px;color:#4a6450;font-size:15px;line-height:1.35}
.card button{font-family:inherit;font-size:18px;font-weight:700;border:0;border-radius:16px;padding:13px 20px;background:#2c8443;color:#fff;box-shadow:0 4px 0 #1d5e2e;min-width:150px}
.card button.ghost{background:#eef3e8;color:#1f3b24;box-shadow:0 4px 0 #cdd8c3}
.card .row{display:flex;gap:10px;justify-content:center}
.card .big{font-size:44px;font-weight:700;color:#2c8443;line-height:1}
.card .stars{font-size:34px;color:#f2b632;margin:6px 0 4px;letter-spacing:4px}
.card .stars .off{color:#d9d6cc}
#rsc table{margin:0 auto 14px;border-collapse:collapse;font-size:13px;color:#1f3b24}
#rsc th{font-weight:700;padding:3px 6px;text-align:left;color:#4a6450}
#rsc td{padding:3px 5px;min-width:20px;text-align:center;border-left:1px solid #e4e8dc}
#rsc td.u{color:#2c8443;font-weight:700}#rsc td.o{color:#c0453a;font-weight:700}
#vig{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(120% 90% at 50% 55%,rgba(0,0,0,0) 55%,rgba(10,25,5,.32) 100%)}
#shot{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:44px;font-weight:700;color:#fff;letter-spacing:.02em;pointer-events:none;z-index:8;opacity:0;transform:scale(.4) rotate(-6deg);
  text-shadow:0 4px 0 #c07a12,0 8px 18px rgba(0,0,0,.45);-webkit-text-stroke:2px #8a4f00;transition:opacity .25s,transform .45s cubic-bezier(.2,1.6,.4,1)}
#shot.small{font-size:30px;top:38%}
#shot.pop{opacity:1;transform:scale(1) rotate(-3deg)}
/* vs Computer roster */
#ros{display:flex;gap:6px}
#ros div{background:rgba(20,36,18,.62);color:#fff;border-radius:12px;padding:4px 10px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;opacity:.7;transition:opacity .2s,transform .2s}
#ros div.on{opacity:1;transform:scale(1.06);box-shadow:0 0 0 2px #ffd65a}
#ros i{width:11px;height:11px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1.5px rgba(0,0,0,.35)}
#ros b{font-size:16px}
/* intro: challenge + opponent picker */
#ich{margin:-4px 0 12px;font-size:15px;color:#1f3b24;font-weight:600}
#ich span{display:block;font-size:11px;letter-spacing:.14em;color:#c98a12;font-weight:700}
#opp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 14px}
#opp button{min-width:0;padding:7px 2px 6px;font-size:12px;border-radius:12px;background:#eef3e8;color:#1f3b24;box-shadow:0 3px 0 #cdd8c3;line-height:1.15}
#opp button b{display:block;font-size:20px}
#opp button small{display:block;font-size:10px;opacity:.65;font-weight:600}
#opp button.sel{background:var(--c,#2c8443);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.28)}
/* result: star captions, vs line, rewarded button */
#rsg{display:flex;flex-direction:column;gap:2px;margin:0 0 10px;font-size:13px;color:#8a9486;font-weight:600}
#rsg .ok{color:#2c8443}
.card p b.vs{display:inline-block;margin-top:6px;color:#1f3b24}
.card button.ad{display:block;margin:0 auto 12px;background:#ffcf3a;color:#5a3a00;box-shadow:0 4px 0 #c99a12;font-size:16px;padding:10px 16px}
#bonus b.r1{color:#c98a12}#bonus b.r2{color:#6b6b6b}#bonus b.r3{color:#e2463a}
#mull{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 54px);transform:translate(-50%,20px);z-index:9;font-family:inherit;font-size:16px;font-weight:700;border:0;border-radius:14px;padding:10px 16px;background:#ffcf3a;color:#5a3a00;box-shadow:0 4px 0 #c99a12;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#mull.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
/* ad break (web test card) */
#adbreak{position:fixed;inset:0;z-index:50;background:rgba(8,12,8,.92);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s}
#adbreak.show{opacity:1}
#adbreak .adbox{width:min(90vw,380px);text-align:center;color:#fff}
#adbreak .adtag{font-size:12px;letter-spacing:.16em;opacity:.7;margin-bottom:10px}
#adbreak .adart{background:linear-gradient(135deg,#2c8443,#1d5e2e 60%,#ffcf3a);border-radius:20px;height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#adbreak .adart b{font-size:72px}#adbreak .adart span{font-size:26px;font-weight:700}#adbreak .adart small{opacity:.8}
#adbreak button{margin-top:16px;font-family:inherit;font-size:17px;font-weight:700;border:0;border-radius:14px;padding:12px 22px;background:#fff;color:#1f3b24}
#adbreak button:disabled{opacity:.55}

/* ---- end-of-hole card (owner 23 Nov: clear, simple, a joy to see) ---- */
.card.res{padding:0 0 18px;overflow:hidden;width:min(86vw,360px)}
.res .rbadge{padding:22px 16px 18px;background:linear-gradient(160deg,var(--c1,#3fb35a),var(--c2,#1f7a3a));color:#fff;position:relative}
.res .rbadge:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:14px;background:#fffdf5;border-radius:16px 16px 0 0}
.res .rword{font-size:46px;font-weight:700;line-height:1;letter-spacing:.01em;text-shadow:0 3px 0 rgba(0,0,0,.18);transform:scale(.6);opacity:0;transition:transform .5s cubic-bezier(.2,1.7,.4,1),opacity .3s}
.res.show .rword{transform:scale(1);opacity:1}
.res .rsub{margin-top:8px;font-size:16px;font-weight:600;opacity:.9}
.res .rstars{display:flex;justify-content:center;gap:14px;margin:14px 0 6px}
.res .rstar{display:flex;flex-direction:column;align-items:center;gap:2px;width:72px}
.res .rstar b{font-size:46px;line-height:1;color:#e3dfd3;transform:scale(.3);opacity:0;transition:transform .45s cubic-bezier(.2,1.8,.4,1),opacity .2s}
.res .rstar.on b{color:#f5b82e;text-shadow:0 0 16px rgba(255,200,60,.65),0 3px 0 #c98a12}
.res .rstar.pop b{transform:scale(1);opacity:1}
.res .rstar small{font-size:12px;font-weight:700;letter-spacing:.06em;color:#9aa396;text-transform:uppercase}
.res .rstar.on small{color:#c98a12}
.res .rcoins{display:inline-flex;align-items:center;gap:8px;margin:6px auto 4px;padding:6px 16px;border-radius:999px;background:#fff4cf;color:#8a5a00;font-size:24px;font-weight:700}
.res .rcoins i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,#f5b82e 55%,#c98a12);box-shadow:inset 0 -2px 0 #b07500}
.res .rvs{display:flex;justify-content:center;gap:8px;margin:12px 16px 0}
.res .rvs:empty{display:none}
.res .rvs div{flex:1;max-width:150px;border-radius:14px;padding:8px 6px;background:#f1f4ec;color:#4a6450;font-weight:700;font-size:15px}
.res .rvs div b{display:block;font-size:26px;color:#1f3b24}
.res .rvs div.win{background:#2c8443;color:#d9f5df}.res .rvs div.win b{color:#fff}
.res .rvs div.win:before{content:"WINNER";display:block;font-size:10px;letter-spacing:.18em;color:#ffd65a}
.res #rsc{margin-top:12px}.res #rsc:empty{display:none}
.res .rnext{display:block;width:calc(100% - 36px);margin:16px auto 10px;font-size:21px;padding:15px}
.res .rrow{display:flex;gap:8px;justify-content:center;padding:0 18px}
.res .rsmall{min-width:0!important;flex:1;font-size:15px!important;padding:10px 8px!important;margin:0!important}

/* power-ups */
#pwr{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 52px);z-index:9;width:52px;height:52px;border-radius:50%;border:0;background:rgba(20,36,18,.72);color:#ffd65a;font:700 22px Fredoka,sans-serif;box-shadow:0 3px 10px rgba(0,0,0,.3)}
#pwr b{position:absolute;right:-2px;top:-2px;min-width:20px;height:20px;border-radius:10px;background:#ff6b5a;color:#fff;font-size:12px;line-height:20px}
#pwr.armed{box-shadow:0 0 0 3px #ffd65a,0 0 18px #ffd65a}
#pwrm{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 112px);z-index:9;display:none;flex-direction:column;gap:6px}
#pwrm.show{display:flex}
#pwrm button{display:flex;align-items:center;gap:8px;border:0;border-radius:14px;padding:9px 12px;background:#fffdf5;color:#1f3b24;font:700 15px Fredoka,sans-serif;box-shadow:0 3px 10px rgba(0,0,0,.25)}
#pwrm button i{font-style:normal;font-size:20px}#pwrm button small{color:#8a9486;margin-left:auto}#pwrm button.shop{background:#ffcf3a;color:#5a3a00}

/* guardian how-to steps */
.card .gstep{display:flex;align-items:center;gap:10px;text-align:left;margin:8px 0;font-size:15px;color:#1f3b24}
.card .gstep i{flex:0 0 28px;height:28px;border-radius:50%;color:#fff;font-style:normal;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px}

/* a card is open: it is the only touchable thing (owner 23 Nov) */
body.modal::before{content:'';position:fixed;inset:0;z-index:9;background:rgba(10,16,10,.28);pointer-events:auto}
body.modal #pwr,body.modal #pwrm,body.modal #mull{display:none!important}

/* aim coach: a hand pulls back from the ball, then releases (shown until the first putt) */
#coach{position:fixed;z-index:6;pointer-events:none;transition:opacity .3s;opacity:0}
#coach .chand{position:absolute;left:-14px;top:6px;font-size:38px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45));animation:coachPull 2.2s ease-in-out infinite}
#coach .ctrail{position:absolute;left:-3px;top:10px;width:6px;height:0;border-radius:3px;background:linear-gradient(#fff,rgba(255,255,255,0));animation:coachTrail 2.2s ease-in-out infinite}
#coach .ctext{position:absolute;left:-130px;top:-78px;width:260px;text-align:center;color:#fff;font:700 20px Fredoka,sans-serif;text-shadow:0 2px 6px rgba(0,0,0,.7)}
#coach .ctext small{display:block;font:600 13px Fredoka,sans-serif;opacity:.9;margin-top:2px}
@keyframes coachPull{0%{transform:translateY(0);opacity:0}12%{opacity:1}55%{transform:translateY(95px)}68%{transform:translateY(95px) scale(.9)}80%{transform:translateY(95px);opacity:1}100%{transform:translateY(95px);opacity:0}}
@keyframes coachTrail{0%{height:0;opacity:0}12%{opacity:.8}55%{height:95px}80%{height:95px;opacity:.8}100%{height:95px;opacity:0}}

/* hole banner: replaces the pre-hole card (owner 23 Nov: "they just need to be taken to the next course") */
#banner{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 128px);transform:translate(-50%,-14px);z-index:7;pointer-events:none;opacity:0;transition:opacity .35s,transform .35s;background:rgba(20,32,18,.82);color:#fff;border-radius:18px;padding:10px 18px;text-align:center;max-width:88vw;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#banner.show{opacity:1;transform:translate(-50%,0)}
#banner b{display:block;font:700 20px Fredoka,sans-serif}#banner span{display:block;font:600 13px Fredoka,sans-serif;color:#ffe9a8;margin-top:2px}

/* pause button + menu (owner 24 Nov) */
#pause{display:flex;align-items:center;justify-content:center;position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:9;width:44px;height:44px;border-radius:14px;border:0;background:rgba(20,36,18,.72);color:#fff;font:700 18px Fredoka,sans-serif;box-shadow:0 3px 10px rgba(0,0,0,.3)}

#pausem h1{margin:0 0 14px}#pausem button{display:block;width:100%;margin:0 0 10px}
#pausem .prow{display:flex;align-items:center;justify-content:space-between;margin:10px 2px 0;font:600 16px Fredoka,sans-serif;color:#1f3b24}
#pausem .tog{width:74px!important;min-width:0!important;margin:0!important;padding:8px 0!important;font-size:15px!important;background:#d8ddd2!important;color:#4a5648!important;box-shadow:0 3px 0 #b9c1b2!important}
#pausem .tog.on{background:#2c8443!important;color:#fff!important;box-shadow:0 3px 0 #1d5e2e!important}
/* the quick round card: auto-hides, any tap dismisses, never blocks play */
#hcard{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translate(-50%,20px);width:min(88vw,380px);z-index:8;pointer-events:none;opacity:0;transition:opacity .35s,transform .35s;background:rgba(255,253,245,.96);border-radius:20px;padding:14px 16px 10px;text-align:center;box-shadow:0 12px 32px rgba(0,0,0,.3)}
#hcard.show{opacity:1;transform:translate(-50%,0)}
#hcard .hk{font:700 12px Fredoka,sans-serif;letter-spacing:.12em;color:#2c8443}#hcard b{display:block;font:700 22px Fredoka,sans-serif;color:#1f3b24;margin:2px 0 4px}
#hcard p{margin:0 0 6px;font:500 14px/1.35 Fredoka,sans-serif;color:#3d5543}#hcard .hch{font:600 13px Fredoka,sans-serif;color:#9a6a00}#hcard small{display:block;margin-top:6px;font:500 11px Fredoka,sans-serif;color:#8a9486}
/* immersive pilot: overview button (whole hole from above), under the pause button */
#ovw{display:flex;align-items:center;justify-content:center;position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 62px);z-index:9;width:44px;height:44px;border-radius:14px;border:0;background:rgba(20,36,18,.72);box-shadow:0 3px 10px rgba(0,0,0,.3)}
body.modal #ovw{display:none}
body.imm #hcard{top:calc(env(safe-area-inset-top) + 118px);bottom:auto}   /* immersive: the round card sits under the HUD, never over the ball (lower third) */
