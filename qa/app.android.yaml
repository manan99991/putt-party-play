# Tenzy — Android. Repo: manan99991/putt-party-play (NATIVE Kotlin + Jetpack Compose, Gradle — NOT Expo).
# Build the test binary:   cd android && ./gradlew :app:assembleDebug
#   -> android/app/build/outputs/apk/debug/app-debug.apk
app:
  name: Tenzy
  path: ${TENZY_APK:-./app-debug.apk}   # the gradle debug APK; blank if already installed
  package: com.tenzy.toolkit             # applicationId
  activity: com.handytools.app.MainActivity   # namespace is com.handytools.app
  login: {}
  base_urls:
    - https://manan99991.github.io/tenzy/
    - https://manan99991.github.io/tenzy/privacy.html
  allow_destructive: false
  forbidden_texts: ["Subscribe", "Start free trial", "Buy", "Restore purchases", "Rate", "Send feedback", "Delete forever"]
  # Tenzy is built FOR automated testing: every tool is a deep-link route. The launch below unlocks Pro
  # and enables uitest mode (skips onboarding + paywall + crash dialog) so the agent reaches every tool.
  # The 30 tool route ids (drive each with: adb shell am start -n com.tenzy.toolkit/com.handytools.app.MainActivity -e route <id>):
  #   fitit scan studio video formatfix scrub cleaner qrwifi stitch shareready light contacts measure magnify
  #   procam gpsdash audiolab rest colorvision sorted textstudio translate voicenotes livecaptions shield lens
  #   memory datagrab describe vault
  goals:
    - "Open every one of the 10 power tools (capture, documents, media, cleanup, voice, translate, instruments, flashlight, safety, share) and exercise EVERY tab and control in each with sensible input; the result must be correct and visible — report any control that does nothing, any blank/empty result, any crash, any spinner that never ends"
    - "This is an internal build with everything unlocked: there must be NO ads, NO paywall, NO 'Go Pro' / quota / limit messages anywhere; report any that appear"
    - "Every screen, tab, modal and sub-screen has a visible Back or Done and never dead-ends (store-review dead-end check)"
    - "Preview-first: in each tool the thing being worked on (photo, page, transcript, result) is shown large above the controls; report any tool that is only buttons and text"
    - "Text never clips or overflows: tool names, tab chips, card labels, buttons — in both light and dark mode (toggle dark mode via adb shell cmd uimode night yes/no between passes)"
    - "Safety: paste the sample scam text, a normal text, a bad link and a 900 number; verdicts must differ sensibly and findings must be explained"
    - "Documents: scan or pick a page, export a PDF, sign a page, merge two PDFs, search a word in Word Finder; each must produce a real result"
    - "Media Studio: pick a photo, shrink to under 1 MB, redact a region, strip metadata; each must save and show before/after sizes"
    - "Clean Up: scan, review a category grid with real thumbnails, move items to Trash, then Restore them"
    - "Flashlight: strobe/SOS/Morse start and STOP cleanly when leaving the screen; Instruments level/compass readouts change when the device moves (emulator sensors may be static — note, don't fail)"
    - "Rotate to landscape in two tools; nothing clipped; state kept. Background the app mid-tool and return: input preserved"
    - "Privacy policy and every external link open and are not 404"
  known_issues: []
  # Route-seeding (agent feature, on main): the explorer deep-links into each tool instead of
  # hoping it taps its way across the 30-tool grid. On Android a route is sent to the launch
  # activity as the `route` string-extra — equivalent to the CI smoke's
  #   am start -n com.tenzy.toolkit/com.handytools.app.MainActivity -e route <id>
  # The non-nil route also skips onboarding, and Pro stays unlocked from the initial `-e route
  # homepro` launch (same process), so Pro tools open too. route_activity defaults to `activity`.
  route_extra: route
  # The 30 tool routes exactly as HomeScreen's HTool grid opens them (onOpen(t.route)) — the real
  # Android nav destinations, not the iOS/catalog ids. Three pages of the launcher grid.
  routes:
    - capture
    - documents
    - media
    - cleanup
    - voice
    - translate
    - instruments
    - flashlight
    - safety
    - share

device:
  platform: android
  name: Pixel_6_API_34
  appium_url: ${APPIUM_URL:-http://127.0.0.1:4723}
  extra_caps:
    appium:autoGrantPermissions: true
    # Unlock Pro + skip onboarding/paywall/crash-dialog so the agent gets into every tool.
    appium:optionalIntentArguments: "-e route homepro -e uitest true"

run:
  max_steps: 400
  max_minutes: 85
  check_links: true
  check_values: true
  check_a11y: true
  check_vision: true
  model: claude-sonnet-5-5
  suite_dir: qa/suite/android
  report_dir: reports
  fail_on: [critical, high]
